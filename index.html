<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>たたかうシリーズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d24;--y:#FFD84A;--r:#FF5A5F;--g:#5BE37D;--c:#7FE7F2;--dim:#9aa0c3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:#fff;font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;font-size:17px;line-height:1.65}
#app{max-width:500px;margin:0 auto;padding:12px 12px 56px;min-height:100vh}
p{margin:0}h1,h2{margin:0;font-weight:400}
sup,sub{font-size:.68em;line-height:0}
button{font:inherit;color:inherit;cursor:pointer}
.win{background:#000;border:3px solid #fff;border-radius:8px;padding:12px 14px;box-shadow:0 0 0 3px #000}
.mt{margin-top:12px}.dim{color:var(--dim)}.y{color:var(--y)}.small{font-size:.86rem}
.cmd{display:block;width:100%;text-align:left;background:#000;border:3px solid #fff;border-radius:8px;padding:10px 14px 10px 32px;position:relative;box-shadow:0 0 0 3px #000}
.cmd::before{content:"▶";position:absolute;left:10px;opacity:0;color:var(--y)}
.cmd:hover::before,.cmd:focus-visible::before{opacity:1;animation:blink .6s steps(2) infinite}
.cmd:focus-visible{outline:none;border-color:var(--y)}
.cmd:active:not(:disabled){transform:translateY(2px)}
.cmd:disabled{cursor:default}
.cmd.pri{border-color:var(--y);color:var(--y)}
@keyframes blink{50%{opacity:.2}}
.logo{text-align:center;padding:18px 0 6px}
.logo h1{font-size:clamp(1.7rem,9vw,2.5rem);color:var(--y);text-shadow:3px 3px 0 #b3402a;letter-spacing:.04em}
.logo svg{width:64px;animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.stat{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center}
.bar{height:12px;border:2px solid #fff;border-radius:3px;background:#222;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);transition:width .35s}
.bar.mid i{background:var(--y)}.bar.low i{background:var(--r)}
.list{display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center}.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pts{margin:6px 0 0;padding-left:1.1em}.pts li{margin:.35em 0}.note .pts li{line-height:1.6}.memo{width:100%;box-sizing:border-box;background:#0d0d24;color:#fff;border:2px solid #fff;border-radius:6px;padding:8px;font:inherit;font-size:.95rem}.lnk{color:#7FE7F2}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.grid3 .cmd{text-align:center;padding:10px 4px}
/* battle */
.hud{display:flex;gap:10px;align-items:center;padding:8px 12px}
.hud .bar{flex:1}
.herb{background:#000;border:3px solid #fff;border-radius:8px;padding:4px 10px;box-shadow:0 0 0 3px #000;white-space:nowrap}
.herb:disabled{opacity:.4}
.field{position:relative;height:190px;margin-top:10px;border:3px solid #fff;border-radius:8px;overflow:hidden;background:linear-gradient(#050514 0 58%,var(--floor,#1b3a4b) 58%);box-shadow:0 0 0 3px #000}
.field::before{content:"";position:absolute;inset:0 0 42% 0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#fff 1px,transparent 1.5px);background-size:47px 39px,61px 53px;background-position:5px 7px,22px 30px;opacity:.5}
.mname{position:absolute;left:10px;top:8px;right:10px;display:flex;gap:10px;align-items:center;font-size:.9rem;z-index:2}
.mname .bar{flex:1;max-width:150px}
.spr{position:absolute;left:50%;bottom:22px;font-size:92px;line-height:1;transform:translateX(-50%);filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));animation:idle 1s steps(2) infinite}
.spr.boss{font-size:118px}
@keyframes idle{50%{transform:translate(-50%,-6px)}}
.spr.hit{animation:hit .35s steps(4)}
@keyframes hit{0%,100%{opacity:1;transform:translateX(-50%)}25%{opacity:.2;transform:translateX(-62%)}50%{opacity:1}75%{opacity:.2;transform:translateX(-38%)}}
.spr.dead{animation:dead .6s forwards}
@keyframes dead{to{opacity:0;transform:translate(-50%,24px) scale(.6);filter:brightness(4)}}
.spr.atk{animation:atk .35s}
@keyframes atk{50%{transform:translate(-50%,26px) scale(1.25)}}
.dmg{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-size:2rem;color:var(--y);text-shadow:2px 2px 0 #000;animation:dmg .8s forwards;z-index:3;white-space:nowrap}
@keyframes dmg{0%{opacity:0;margin-top:20px}20%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-34px}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(5px,-2px)}}
.redflash{animation:rf .35s}
@keyframes rf{50%{background:#5a0d12}}
.q{margin-top:10px;min-height:92px}
.q .tag{display:block;color:var(--c);font-size:.82rem}
.gauge{height:8px;margin:8px 3px 0;background:#222;border-radius:4px;overflow:hidden}
.gauge i{display:block;height:100%;width:100%;background:var(--y)}
.gl{font-size:.75rem;color:var(--dim);margin:2px 3px 0}
.ch{display:grid;gap:8px;margin-top:8px}
.ch.two{grid-template-columns:1fr 1fr}
.ch.two .cmd{text-align:center;padding:10px;font-size:1.7rem}
.ch.two .cmd::before{display:none}
.cmd.good{border-color:var(--g);color:var(--g)}
.cmd.bad{border-color:var(--r);color:var(--r)}
.cmd.off{opacity:.35}
.log{margin-top:10px}
.log p.crit{color:var(--y)}.log p.lv{color:var(--c)}.log p.ng{color:var(--r)}
.ex{margin:8px 0 10px;padding:8px 10px;border:2px dashed var(--dim);border-radius:6px;font-size:.93rem}
.miss{list-style:none;margin:6px 0 0;padding:0}
.miss li{border-top:2px dashed #444;padding:8px 0;font-size:.92rem}
.miss b{display:block;font-weight:400;color:var(--y)}
.zk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.zk div{border:2px solid #444;border-radius:6px;padding:6px 2px;font-size:.68rem;line-height:1.3}
.zk span{display:block;font-size:2rem;line-height:1.3}
.zk .no span{filter:brightness(0) invert(.25)}
.center{text-align:center}
.big{font-size:1.5rem;color:var(--y)}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cmd b{font-weight:400;display:block}
.cmd .sub{display:block;font-size:.74rem;color:var(--dim);line-height:1.45;margin-top:2px}
.cmd:disabled .sub{opacity:.6}
.cd{border:2px solid #fff;border-radius:4px;padding:0 6px;background:#000;white-space:nowrap}
.cd.warn{border-color:var(--r);color:var(--r);animation:blink .6s steps(2) infinite}
.mp{color:var(--c);white-space:nowrap}
.ng{color:var(--r)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tags:empty{display:none}
.stsb,.shb{border:2px solid var(--r);color:var(--r);border-radius:6px;padding:0 8px;font-size:.8rem;background:#000}
.shb{border-color:var(--c);color:var(--c)}
.spr.charge{filter:drop-shadow(0 0 12px #FF5A5F) drop-shadow(0 6px 0 rgba(0,0,0,.45))}
body.weakflash{animation:wf .45s}
@keyframes wf{30%{background:#5a4a0d}}
.gear{border-color:var(--rc)}
.ge{font-size:2.2rem;line-height:1;margin-right:8px}
.rar{color:var(--rc);border:2px solid var(--rc);border-radius:4px;padding:0 5px;font-size:.75rem}
.nw{color:#000;background:var(--y);border-radius:4px;padding:0 5px;font-size:.75rem}
.pullfx{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:12px}
.cap{font-size:110px;line-height:1;animation:capsh .25s steps(2) infinite;filter:drop-shadow(0 0 24px var(--rc))}
@keyframes capsh{50%{transform:rotate(-12deg)}}
.fig{margin-top:8px;border:3px solid #fff;border-radius:8px;background:#06061a;padding:6px;box-shadow:0 0 0 3px #000}
.figsvg{display:block;width:100%;height:auto}
.figsvg .ft{fill:#cfd3e6;font-size:11px;font-family:inherit}
.figsvg .ft.small{font-size:10px}
.figsvg .fp{fill:none;stroke:#FFD84A;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.figsvg .fp.thin{stroke-width:3}.figsvg .fp.thick{stroke-width:7}
.figsvg .fv{fill:none;stroke:#FF5A5F;stroke-width:5;stroke-linecap:round}
.figsvg .fg{fill:#FF5A5F}.figsvg .fm{fill:#7FE7F2}
.figsvg .fl-line{stroke:#9aa0c3;stroke-width:1.5}
.figsvg .fb{fill:#5b1a24;stroke:#FF5A5F;stroke-width:2}
.figsvg .ftb{fill:#3b3410;stroke:#FFD84A;stroke-width:2}
.figsvg .fa{fill:none;stroke:#fff;stroke-width:3;marker-end:url(#ar)}
.figsvg .fc{fill:#14143a;stroke:#9aa0c3;stroke-width:2}
.figsvg .fx{fill:#000;stroke:#7FE7F2;stroke-width:3}
.figsvg .tk{fill:none;stroke-width:3;stroke-dasharray:5 4;opacity:0}
.figsvg .tk.inu{stroke:#7FE7F2}.figsvg .tk.pah{stroke:#FF9AD5}.figsvg .tk.glu{stroke:#5BE37D}
.figsvg .tk.on{opacity:1}
.fig.hl .figsvg :is(.fp,.fv,.fg,.fm,.fa,.fx,.fb,.ftb,.ft){opacity:.28}
.fig.hl .figsvg .on{opacity:1}
.figsvg .fp.on{stroke:#fff}.figsvg .ft.on{fill:#FFD84A}
.figsvg .on:not(.ft){filter:drop-shadow(0 0 4px #FFD84A)}
.card .fig{margin-top:6px}
.flr{border-top:2px dashed #444;padding-top:8px}.flr:first-of-type{border-top:0}
.figsvg .fch{fill:#cfd3e6;font-size:10.5px;font-family:inherit}.fig.hl .figsvg .fch tspan{fill:#5d6283}.fig.hl .figsvg .fch tspan.on{fill:#FFD84A}
.ln.old{opacity:.55}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.talk{display:grid;gap:10px}
.ln{display:flex;gap:10px;align-items:flex-start;background:#000;border:3px solid #fff;border-radius:8px;padding:8px 10px;box-shadow:0 0 0 3px #000}
.ln.bs{border-color:var(--r)}
.ln .face{font-size:2rem;line-height:1.25;flex:none;width:2.4rem;text-align:center}
.ln .nm{font-size:.8rem;display:block;line-height:1.4}
.ln.new{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.tbar{position:sticky;bottom:8px;z-index:5;background:var(--bg);padding-top:4px}
#nxb{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;pointer-events:none}
#nxb.on{display:block}
#nxb .in{max-width:500px;margin:0 auto;padding:22px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(13,13,36,0),var(--bg) 45%);pointer-events:auto}
#nxb .cmd{margin:0;height:54px;padding:0 10px 0 26px;display:flex;align-items:center;justify-content:center;white-space:nowrap;text-align:center}
#nxb .grid2{grid-template-columns:.75fr 1.25fr}
#nxb .cmd .small{margin-left:.4em}
.nxsp{height:92px}
#app:has(.rd){min-height:0;padding-bottom:0}
.rd{display:flex;flex-direction:column;height:calc(100vh - 112px);height:calc(100dvh - 112px);min-height:260px}
.rd>*{flex:none}
.rd .stagei{font-size:2.2rem;margin-top:2px}
.rd .fig svg{max-height:30vh;max-height:30dvh}
.rd .lg{flex:1 1 auto;min-height:0;overflow-y:auto;align-content:start;padding:3px 6px 3px 3px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--c) transparent;-webkit-overflow-scrolling:touch}
.rd .lg::-webkit-scrollbar{width:6px}.rd .lg::-webkit-scrollbar-thumb{background:var(--c);border-radius:3px}
.rd .ln.old{opacity:.62}
.stagei{text-align:center;font-size:3rem;line-height:1.1;margin-top:6px}
.cart{padding:14px 14px 14px 32px}
.cart .cic{float:right;font-size:2.4rem;line-height:1}
.cart b{font-size:1.15rem;color:var(--y)}
a.vid{text-decoration:none;color:#fff;display:block}


/* ---- バトル画面：右上奥に てき、左下に じぶん ---- */
.field.bt{height:250px;background:linear-gradient(#0b1030 0 52%,var(--floor,#1b3a4b) 52%)}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.field.bt .mname{right:auto;width:58%;flex-wrap:wrap;gap:4px 8px;background:rgba(0,0,0,.55);padding:4px 7px;border-radius:6px}
.field.bt .spr{left:auto;right:8%;bottom:auto;top:44px;transform:none;font-size:74px;animation:idle2 1.3s ease-in-out infinite;z-index:2}
.field.bt .spr.boss{font-size:92px;top:30px}
.field.bt .spr img,.sprin img{width:118px;height:118px;object-fit:contain;display:block}
.field.bt .spr.boss img{width:150px;height:150px}
@keyframes idle2{50%{transform:translateY(-6px)}}
.field.bt .spr.hit{animation:hit2 .4s}
@keyframes hit2{0%,100%{transform:none;filter:none}15%{transform:translateX(9px);filter:brightness(4)}35%{transform:translateX(-7px)}55%{transform:translateX(5px);filter:brightness(4)}75%{transform:translateX(-3px)}}
.field.bt .spr.dead{animation:dead2 .7s forwards}
@keyframes dead2{30%{filter:brightness(5)}to{opacity:0;transform:translateY(18px) scale(.5);filter:brightness(5)}}
.field.bt .spr.atk{animation:eatk .5s ease-in}
@keyframes eatk{45%{transform:translate(-110px,80px) scale(1.15)}}
.mshadow{position:absolute;right:calc(8% + 12px);top:126px;width:92px;height:16px;border-radius:50%;background:rgba(0,0,0,.45);z-index:1}
.mshadow.boss{top:140px;width:120px}
.plw{position:absolute;left:5%;bottom:4px;width:130px;height:132px;z-index:3}
.plw:before{content:"";position:absolute;left:14px;bottom:0;width:100px;height:14px;border-radius:50%;background:rgba(0,0,0,.45)}
.pl{position:absolute;left:10px;bottom:4px;line-height:1;transform-origin:50% 100%;animation:pidle 1.4s ease-in-out infinite}
.plemo{font-size:68px;display:block}
.pl img,.plin img{width:120px;height:120px;object-fit:contain;display:block}
.pcos{position:absolute;left:44px;bottom:6px;font-size:34px;filter:drop-shadow(0 2px 0 #000)}
@keyframes pidle{50%{transform:scaleY(.97)}}
.pl.atk{animation:patk .42s ease-out}
@keyframes patk{40%{transform:translate(70px,-46px) rotate(6deg)}}
.pl.cast{animation:pcast .65s}
@keyframes pcast{30%,70%{transform:translateY(-8px);filter:drop-shadow(0 0 14px #FFD84A) brightness(1.4)}}
.pl.hurt{animation:phurt .5s}
@keyframes phurt{0%,100%{opacity:1}20%,60%{opacity:.25;transform:translateX(-9px)}40%,80%{opacity:1;transform:translateX(6px)}}
.pet{position:absolute;right:-8px;bottom:6px;font-size:30px;animation:petb 1.6s ease-in-out infinite}
.pet img{width:54px;height:54px;object-fit:contain}
@keyframes petb{50%{transform:translateY(-8px)}}
.acc-a1 .pet{right:-4px;bottom:70px}.acc-a5 .pet{right:6px;bottom:84px}
.acc-a3 .pl{filter:drop-shadow(0 0 10px #FFD84A) drop-shadow(0 0 20px #FFF3A0)}
.acc-a4 .pet{right:auto;left:-4px;bottom:34px;font-size:46px;z-index:-1;animation:wing 1.2s ease-in-out infinite}
@keyframes wing{50%{transform:rotate(-10deg) translateY(-4px)}}
.acc-a6 .pet{right:auto;left:6px;bottom:-12px;font-size:64px;opacity:.85;animation:spin 6s linear infinite;z-index:-1}
.acc-a6 .pet img{width:110px;height:40px}
@keyframes spin{to{transform:rotate(360deg)}}
.field.bt .dmg{left:auto;right:12%;top:18%;transform:none}
.field.bt .dmg.big{font-size:2.8rem;color:#FF9A5A}
.fx{position:absolute;pointer-events:none;z-index:5;transform:translate(-50%,-50%)}
.fx.at-mon{left:74%;top:38%}.fx.at-pl{left:23%;top:72%}
.fx.slash,.fx.spin,.fx.pierce,.fx.holy{width:130px;height:130px;border-radius:50%;border-top:8px solid var(--c);filter:drop-shadow(0 0 8px var(--c));animation:fxslash .38s forwards}
.fx.pierce{border-radius:0;border-top-width:6px;width:160px;height:20px;transform:translate(-50%,-50%) rotate(-28deg);animation:fxpierce .3s forwards}
.fx.spin{border:6px dashed var(--c);animation:fxspin .45s forwards}
.fx.holy{border:0;background:radial-gradient(circle,#fff 0 12%,var(--c) 30%,transparent 62%);animation:fxburst .55s forwards}
@keyframes fxslash{0%{opacity:0;transform:translate(-50%,-50%) rotate(-70deg) scale(.6)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(40deg) scale(1.15)}}
@keyframes fxpierce{0%{opacity:0;width:20px}40%{opacity:1}100%{opacity:0;width:200px}}
@keyframes fxspin{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.4)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(540deg) scale(1.2)}}
.fx.beam{width:240px;height:10px;left:24%;top:70%;transform:rotate(-27deg);transform-origin:0 50%;background:linear-gradient(90deg,transparent,var(--c),#fff);border-radius:6px;filter:drop-shadow(0 0 8px var(--c));animation:fxbeam .35s forwards}
@keyframes fxbeam{0%{opacity:0;width:0}50%{opacity:1;width:240px}100%{opacity:0;width:240px}}
.fx.impact{width:90px;height:90px;border-radius:12px;border:7px solid var(--c);animation:fxburst .4s forwards}
.fx.burst{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,var(--c) 35%,transparent 70%);animation:fxburst .45s forwards}
@keyframes fxburst{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}
.fx.orb{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,var(--c) 55%,transparent 72%);filter:drop-shadow(0 0 10px var(--c));animation:fxorb .45s ease-in forwards}
@keyframes fxorb{0%{left:26%;top:66%;opacity:.3}20%{opacity:1}100%{left:74%;top:38%;opacity:1}}
.fx.img img{width:160px;height:160px;object-fit:contain;display:block}
.fx.img{animation:fximg .5s forwards}
@keyframes fximg{0%{opacity:0;transform:translate(-50%,-50%) scale(.6) rotate(-12deg)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25) rotate(8deg)}}
.scr{text-align:right;font-size:.85rem;color:#FFD84A;margin-top:4px;letter-spacing:1px}
.scr.up{animation:scup .4s}.scr.down{animation:scdn .4s}
@keyframes scup{40%{transform:scale(1.15);color:#B9F27F}}@keyframes scdn{40%{transform:translateX(-4px);color:#FF5A5F}}
.sc{color:#B9F27F}
/* ---- ショップ ---- */
.shopv{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.field.mini{height:150px;margin:0;background:linear-gradient(#0b1030 0 55%,#2a3a5b 55%)}
.field.mini .plw{left:4px;bottom:2px}
.shopi.on{border-color:#FFD84A}
.sic{display:inline-flex;width:56px;height:56px;align-items:center;justify-content:center;font-size:40px;margin-right:10px;flex:none}
.sic img{width:56px;height:56px;object-fit:contain}
.rng{position:relative;height:12px;margin-top:8px;border:2px solid #fff;border-radius:6px;background:#111}

</style>
</head>
<body>
<div id="app"></div>
<div id="nxb" aria-live="polite"></div>
<script>
/* ============ データ（講義資料「腎機能／水と電解質のバランスの調節」より） ============ */
/* ============ たたかう腎生理学：導入会話 ============ */
const JIN_CAST={s:{e:"💧",n:"しずく",c:"#7FE7F2"},n:{e:"🫘",n:"ネフ先輩",c:"#FFD84A"},m:{e:"🧚",n:"ミクロ",c:"#FF9AD5"},

 talk:[["sora","ヒュー…ヒュー…。馬小屋に行ったら、急に息が苦しくなって…"],["s","ソラくん！　ハカセ、これって喘息発作？"],["h","うむ。気管支がキュッと縮んでおる。すぐにサルブタモールを吸入じゃ。β2を刺激して、数分で気管支を広げる"],["m","発作をその場で止める薬を「リリーバー」っていうよ！"],["sora","…はぁ、楽になった。でも毎晩せきが出るのはなんで？"],["h","喘息の正体は、気道のしつこい炎症なんじゃ。だから毎日の「コントローラー」として吸入ステロイドを使う"],["m","吸ったあとはうがい！　口の中にカビ（カンジダ）が生えたり、声がかれたりするからね"],["s","ステロイドとβ2が1本になった吸入薬もあるんだよね"],["h","ICS＋LABAの合剤じゃな。足りなければロイコトリエン拮抗薬やテオフィリン、それでも重いときは抗IgE抗体や抗IL-5抗体の出番じゃ"],["gen","わしは若いころからタバコを吸っとって、階段で息切れするんじゃ"],["h","COPDじゃのう。こちらの主役はLAMA、長時間効く吸入抗コリン薬のチオトロピウムじゃ"],["m","でも抗コリン薬だから、緑内障や前立腺肥大の人は注意！"],["s","咳止めはどう使い分けるの？"],["h","乾いた咳なら鎮咳薬。痰がからむ咳を無理に止めると、痰が出せなくなる。そのときは去痰薬じゃ"],["h","そして、肺がだんだん硬くなる特発性肺線維症。これにはピルフェニドンやニンテダニブという抗線維化薬を使う"],["boss","ゴゴゴ…肺を石のように固めてやる…"],["s","抗線維化薬で立ち向かおう！"]],

stgM({n:"アレルギーの4つの型",ic:"🌸",boss:"アナフィラキシー",bi:"🐝",sub:"山崎 11/12",
 pts:["アレルギー＝無害な抗原（アレルゲン）に対する過敏反応。アレルゲンは吸入（花粉・ダニ・カビ）、刺入（蜂毒・注射薬）、摂取（ピーナッツ・エビ）、接触（うるし・ニッケル）","I型：IgEによる即時型（アナフィラキシー、じんましん、花粉症、喘息、食物アレルギー）。II型：IgG自己抗体が自分の細胞に結合（自己免疫性溶血性貧血、Goodpasture症候群）。III型：免疫複合体の沈着（アルサス反応、血清病）。IV型：T細胞による細胞性免疫（ツベルクリン反応、接触皮膚炎、1型糖尿病）","I型は感作相（抗原特異的IgE産生→肥満細胞のFcεRIに結合）とエフェクター相（抗原がIgEに結合して脱顆粒）。即時反応は数秒〜数十分、遅延型反応は数時間後に好酸球やTh2が起こす","投与ルートで反応が決まる：静脈内の高用量はアナフィラキシー、皮下の低用量はじんましん、吸入はアレルギー性鼻炎・喘息、経口は下痢・じんましん・アナフィラキシー。重症喘息などはIgEに対するモノクローナル抗体で治療"],

stgK({n:"守りと常在菌",ic:"🛡️",boss:"ニューモシスチス",bi:"🫁",sub:"伊藤 細菌学3",
 pts:["免疫＝非自己を判別して排除し、生体の恒常性を維持するシステム。異常な反応として易感染性・アレルギー・自己免疫疾患・悪性腫瘍がある","免疫細胞は骨髄の造血幹細胞から。骨髄系前駆細胞→マクロファージ・顆粒球・マスト細胞、リンパ系前駆細胞→B細胞・T細胞・NK細胞。一次リンパ組織は骨髄（B細胞）と胸腺（T細胞）、二次リンパ組織は脾臓（血行性）・リンパ節（リンパ行性）・粘膜関連リンパ組織","補体：オプソニン化と貪食はC3の活性化が主、MACによる溶菌・白血球走化・アナフィラトキシンはC5の活性化による。補体は莢膜をもつ細菌（髄膜炎菌・肺炎球菌・インフルエンザ菌）の排除に重要で、終末補体（C5-C9）の障害やC5阻害薬では髄膜炎菌感染症に注意","液性免疫不全（多発性骨髄腫、慢性リンパ性白血病、脾摘後など）では莢膜をもつ細菌に弱い。細胞性免疫不全（ステロイド、移植、HIVなど）ではレジオネラ・サルモネラ・ノカルジア・リステリア・抗酸菌・VZV・CMV・クリプトコッカス・ニューモシスチスなどに弱い。常在菌叢は病原菌の定着を防ぐ（成人で約38兆個、大腸に大部分）"],

stgK({n:"抗生物質と耐性菌",ic:"💊",boss:"エムアールエスエー",bi:"🟣",sub:"抗生物質 スライド-2",
 pts:["殺菌性は微生物を殺す、静菌性は増殖を抑える。どちらになるかは感染部位に届く薬物濃度で決まることがある（高濃度で殺滅、低濃度で抑制）","作用点で5つに分類。細胞壁合成阻害（β-ラクタム、グリコペプチド、ホスホマイシン）、タンパク合成阻害（アミノグリコシド30S、テトラサイクリン30S、マクロライド50S、クロラムフェニコール50S、リンコマイシン50S）、核酸合成阻害（キノロン＝DNAジャイレース・トポイソメラーゼIV、リファンピシン＝RNAポリメラーゼ）、代謝阻害（スルファメトキサゾール・トリメトプリム＝葉酸、イソニアジド＝ミコール酸）、膜機能阻害（ポリミキシンB、コリスチン）","セフェムは世代で広がる。第1世代はグラム陽性菌によく効き、第2世代で陽性＋好気性陰性に、第3世代は好気性グラム陰性菌に、第4世代は好気性グラム陰性菌にとくに強い。バンコマイシンはD-Ala-D-Alaと結合してペプチドグリカンの架橋を止め、MRSAに使う","耐性のしくみは4つ：薬剤を酵素で分解・修飾する（β-ラクタマーゼ、ESBL、メタロβ-ラクタマーゼ）、標的部位が変わる（MRSAのPBP2'＝mecA、VREのvanA/vanB、キノロン耐性のgyrase変異）、薬剤排出の亢進、膜透過性の低下。MICは増殖を抑える最低濃度、ブレイクポイントは治療に有効とされる濃度"],

 pts:["グラム陰性通性嫌気性桿菌には腸内細菌科（エシェリキア、シゲラ、サルモネラ、クレブシエラ、シトロバクター、エンテロバクター、プレジオモナス）、モルガネラ科、エルシニア科、ビブリオ科、エロモナス科、パスツレラ科などがある。腸内細菌科のうち病原性が強いのはエシェリキア・シゲラ・サルモネラ、弱いのはクレブシエラ・シトロバクター・エンテロバクター（日和見感染）","病原因子は定着性・侵襲性・毒素産生性・生体防御機構への抵抗力。大腸菌はヒトの便の常在菌の0.1%で、外来遺伝子を獲得すると病原菌になる。O抗原（細胞壁、約180種）・H抗原（鞭毛、56種）・K抗原（莢膜、103種）の組合せで血清型が決まる。O157:H7のO157はO抗原の157番","下痢を起こす大腸菌は5種類。EHEC（腸管出血性：志賀毒素）、EPEC（腸管病原性：BFP線毛＋III型分泌機構。EHECから志賀毒素を除いてBFPを加えたもの）、EIEC（腸管侵入性：遺伝学的に赤痢菌と同一菌種）、ETEC（毒素原性：CFA線毛とLT・ST。LTはコレラ毒素と類似）、EAEC（腸管凝集付着性）。III型分泌機構はタンパクを宿主細胞内に注入する装置","志賀毒素はAB5型毒素。BサブユニットがGb3受容体に結合し、Aサブユニットが細胞内に入ってタンパク合成を阻害する。血管内皮細胞にGb3が多く、大腸では出血性大腸炎、腎臓ではHUS（溶血性尿毒症症候群）、脳では急性脳炎。腸管外感染症はUPEC（Pap線毛→膀胱炎・腎盂炎）とK1大腸菌（新生児髄膜炎）"],

stgK({n:"臓器ごとに菌をえらぶ",ic:"🩺",boss:"ふくまくえんのきん",bi:"🫃",sub:"細菌感染症①（永瀬 11/4）",
 pts:["発熱の原因は感染症（約40%）のほか悪性腫瘍、自己炎症・自己免疫疾患など。感染症診療のロジックは①患者背景②どの臓器に何が起きているか③原因微生物は④どう治療するか⑤経過観察。微生物はランダムに臓器を侵さない。原因微生物の名を具体的に挙げられなければ先に進まない","抗菌薬の適正使用は最大の効果・最小の毒性・最小の耐性化。抗菌薬に「強い」「弱い」はない。培養結果が出たら狭いスペクトルへ変えるのがde-escalation","胆道感染症（胆管炎・胆嚢炎・肝膿瘍）と腹腔内感染症の原因菌は、E. coli・Klebsiella・Proteus（PEK）とBacteroides属などの嫌気性菌。第三世代セファロスポリン耐性≒ESBL産生菌。腹膜炎は原発性（1%）、続発性（80–90%）、術後（三次性）、CAPD腹膜炎に分けられ、CAPDではグラム陽性球菌が60–80%","腸管感染症：毒素型（S. aureus・B. cereus・C. botulinum）、小腸型（ETEC・V. cholerae・C. perfringens・V. parahaemolyticus）、大腸型（C. jejuni・Salmonella・Y. enterocolitica）。尿路感染は単純性でE. coli・S. saprophyticus、複雑性で腸内細菌目・Pseudomonas・Enterococcus。尿道炎は淋菌、クラミジア、M. genitalium、トリコモナスなど"],

stgK({n:"肺炎と髄膜炎に挑む",ic:"🧠",boss:"ずいまくえんきん",bi:"🔴",sub:"臨床で生かす細菌学（古谷 11/6）",
 pts:["感染症診療は原因微生物・感染臓器・抗菌薬の三角形で考える。感染臓器を特定すれば原因微生物を推定でき、原因微生物が分かれば感染臓器を推定できる","市中細菌性肺炎のBig 6：定型肺炎（Streptococcus pneumoniae、Haemophilus influenzae、Moraxella catarrhalis）はグラム染色で確認でき、第一選択はβ-ラクタム系。非定型肺炎（Mycoplasma pneumoniae、Legionella pneumophila、Chlamydia pneumoniae）はグラム染色で確認できず、第一選択は非β-ラクタム系。喀痰の質はGeckler分類で評価し、4・5が良質な痰","細菌性髄膜炎の古典的三徴は発熱・頭痛・項部硬直だが、そろうのは60歳以下で36%、60歳以上で58%。髄膜刺激徴候は特異度が高く感度が低い。疑ったら1時間以内に抗菌薬を投与し、血液培養は必ず採取、腰椎穿刺に時間がかかるなら抗菌薬を先に投与してよい。頭部CTの目的は他疾患の除外と脳ヘルニアの確認","髄膜炎の原因菌は年齢で変わる（1か月未満：S. agalactiae・E. coli・L. monocytogenes、2〜50歳：S. pneumoniae・N. meningitidis、50歳以上：加えてL. monocytogenesと好気性グラム陰性桿菌）。Listeria髄膜炎にはABPC、髄膜炎菌髄膜炎にはPCG・CTRX・CTXが選択肢。細菌性髄膜炎は内科的Emergency"],

 pts:["血液培養は好気・嫌気ボトルを別部位から2セット採取し、抗菌薬投与前に行う。グラム陽性球菌：S. aureusは1セットでも真の菌血症、コアグラーゼ陰性ブドウ球菌は1セットのみならコンタミのことが多い（カテーテル関連血流感染症は例外）、レンサ球菌は真の菌血症のことが多い。腸内細菌目細菌・ブドウ糖非発酵菌は基本的に真の菌血症","菌の形は、房状（cluster）＝S. aureus、鎖状（chain）＝Streptococcus spp.（長い）・Enterococcus spp.（短い）、双球菌＝S. pneumoniae。S. aureusは黄金色（aureus＝金）のβ溶血コロニーで、健康成人の最大30%が鼻前庭に保菌","感染性心内膜炎（IE）は弁膜や心内膜に菌の集まり（疣贅）ができる全身性の敗血症性疾患。起因菌はブドウ球菌とレンサ球菌が多く、HACEK群はグラム陰性桿菌でIEの1–2%。Osler結節は有痛性、Janeway病変は無痛性、Roth斑は眼底で探さないと見つからない。診断はModified Duke基準（Definite・Possible・Rejected）","化膿性関節炎は血流感染による播種や直接進展で起こり、約8割にリスク因子があり、原因はグラム陽性球菌（Staphylococcus 56%）が多い。血液培養と関節液培養を必ず採り、白血球5万/μL超は感染を疑う。皮膚軟部組織感染症は浅い順にせつ・よう、丹毒、蜂窩織炎、壊死性筋膜炎で、必ず壊死性筋膜炎を除外する。S. pyogenesは治療にPCGとクリンダマイシンを併用することがある"],
 talk:[["s","血液や心臓や関節の感染って、菌の見分け方はあるの？"],["k","血液培養の結果の読み方がまず肝心じゃ。形で菌を絞れる"],["m","1セットだけ陽性でも、菌によって本物かコンタミか違うのよ！"],["k","そして皮膚軟部の感染では、必ず壊死性筋膜炎を除外せねばならぬ"],["boss","…ふん。見た目の赤みだけで、わしは見抜けまい"],["s","S. pyogenes…！　順番に判断のしかたを覚えよう"]],

 pts:["淋菌と髄膜炎菌はグラム陰性の双球菌（腎臓形）。ヒトが唯一の宿主。線毛と外膜タンパクで付着・定着し、抗食菌作用をもつ。IgAプロテアーゼでIgAを切断する。淋菌は男性尿道炎（排尿痛・黄色膿性分泌物）、女性子宮頸管炎（症状が軽い）から骨盤腹膜炎・卵管炎（約20%が不妊）、新生児膿漏眼、播種性感染（化膿性関節炎）を起こす","髄膜炎菌は鼻咽腔に5〜15%が保菌され、血流に入ると髄膜炎菌性敗血症を起こす。髄膜炎では発熱・頭痛・項部硬直・嘔吐、点状出血性発疹がみられる。Waterhouse-Friderichsen症候群は小児の急性電撃性敗血症で、紫色の斑状皮膚出血・副腎壊死を起こす。診断は髄液のグラム染色とラテックス凝集反応。ワクチンは血清群A・C・W・Yの莢膜に有効だがBには無効。家族の予防にはリファンピシンを使う","梅毒（Treponema pallidum）は第1期（硬性下疳・無痛性横痃）、第2期（バラ疹・扁平コンジローマ）、第3期（ゴム腫・大動脈炎）、第4期（脊髄癆・進行麻痺）。軟性下疳（Haemophilus ducreyi）は軟らかく疼痛が激しく鼠径が有痛性。回帰熱はシラミ（B. recurrentis）やダニ（B. duttonii）が媒介。ライム病（B. burgdorferi）はマダニで遊走性紅斑。ワイル病（Leptospira）はドブネズミが感染源で黄疸・腎不全","カンピロバクターは鶏肉から多く検出され（約38%）、血便を起こすが経過は短い。H. pyloriは慢性炎症と好中球浸潤を起こし、除菌すると炎症細胞の浸潤が減り好中球は認められなくなる"],

 pts:["マイコプラズマは細胞壁（ペプチドグリカン層）をもたず、人工培地で増殖でき、コレステロールを要求するものが多く、目玉焼き状のコロニーを作る。診断は培養（PPLO寒天）、寒冷血球凝集反応（CHA、256倍以上）、血中特異抗体、遺伝子診断。治療はマクロライド系が第一選択（学童期以降はミノサイクリンも）で、β-ラクタム系は無効","クラミジアは偏性細胞寄生性でペプチドグリカンを欠く。基本小体（EB）は感染性で宿主から宿主へ伝播し、網様体（RB）は非感染性で二分裂して増殖し、20〜24時間後にEBへ戻る。C. pneumoniae（動脈硬化との関連）、C. psittaci（オウム病：鳥の排泄物の吸入）、C. trachomatis（トラコーマ・非淋菌性尿道炎・新生児肺炎）","リケッチアは偏性細胞寄生性のグラム陰性菌で、節足動物が媒介する。ツツガムシ病（Orientia tsutsugamushi）はツツガムシの幼虫が媒介し、刺し口・発熱・発疹の三主徴。日本紅斑熱（Rickettsia japonica）はマダニが媒介し、掻痒のない紅斑。Q熱（Coxiella burnetii）はベクター不要の人獣共通感染症","この仲間はすべてβ-ラクタム系が無効で、テトラサイクリン系（ミノサイクリン・ドキシサイクリン）やマクロライド系が中心。ツツガムシ病・日本紅斑熱・オウム病・Q熱は4類感染症"],

 pts:["真菌は真核生物（核膜・ミトコンドリア・80Sリボソーム）。細胞膜にエルゴステロール、細胞壁にβ-グルカンとキチンをもつ。酵母・糸状菌・二形性真菌に分け、感染は表在性（皮膚糸状菌）・皮下（スポロトリコーシス）・深在性に分類する","カンジダは口腔・消化管・腟の常在菌で、広域抗菌薬・中心静脈カテーテル・好中球減少がリスク。血液培養でカンジダが出たら重視して治療し、喀痰からの検出は定着が多い。アスペルギルスは分生子の吸入で、ABPA・CPA・IPAの3病型。IPAは好中球減少や移植が危険因子で、ガラクトマンナンは補助診断","クリプトコックスは莢膜をもつ出芽酵母で、細胞性免疫不全に多く、髄膜炎を起こす。墨汁染色と莢膜抗原（CrAg）で診断し、墨汁陰性だけでは除外できない。ニューモシスチス肺炎はST合剤が第一選択で、β-D-グルカンは補助的。ムーコル症は糖尿病性ケトアシドーシスや好中球減少でみられ、β-D-グルカン・ガラクトマンナンで除外できない","薬の標的：ポリエン系（アムホテリシンB）＝エルゴステロールに結合、アゾール系＝エルゴステロール合成阻害（ボリコナゾールはアスペルギルス）、エキノキャンディン系＝β-1,3-グルカン合成阻害（カンジダ血症）。クリプトコックスとムーコルにはエキノキャンディンは不十分"],

 pts:["能動免疫は抗原曝露で自分の獲得免疫を誘導し、立ち上がりに時間はかかるが記憶が残る。受動免疫は免疫グロブリンを投与するので速効性があるが一時的。二次応答では記憶B細胞・T細胞により速く強い応答が起こる。ワクチンは感染予防・発症予防・重症化予防を区別して評価する","生ワクチン（麻疹・風疹・水痘・おたふく・BCG・ロタ）は弱毒化した生きた微生物で、限定増殖して強い免疫を誘導するが、妊娠や重度免疫不全では禁忌。不活化・成分ワクチンは増殖せず、追加接種やアジュバント（アルミニウム塩など）で補強する。トキソイドは毒素を無毒化した抗原で、毒素中和抗体が防御の中心","莢膜多糖はT細胞非依存性で、乳幼児では免疫記憶が不十分。結合型ワクチンはキャリアタンパクと結合してT細胞ヘルプを得る（Hib・肺炎球菌・髄膜炎菌）。破傷風・ジフテリアはトキソイド、百日咳は無細胞成分ワクチン、BCGは弱毒化ウシ型結核菌の生ワクチン","接種の実務：注射生ワクチン同士は同日でなければ27日以上あける。primary failureは初回免疫の獲得不十分、secondary failureはいったん獲得した防御が時間とともに低下すること。副反応と接種後有害事象は同義ではない。2026年度から高齢者肺炎球菌の定期接種は20価結合型に変更"],

stgK({n:"好気性グラム陰性桿菌",ic:"🚿",boss:"レジオネラ",bi:"🚿",sub:"緑膿菌・アシネトバクター・百日咳菌・レジオネラ・人獣共通感染症",
 pts:["緑膿菌は好気性・非発酵性のグラム陰性桿菌で、オキシダーゼ陽性・運動性あり、ピオシアニンを産生する。湿潤環境に広く存在し、熱傷・人工呼吸器・嚢胞性線維症・免疫不全で問題。III型分泌系、エキソトキシンA、バイオフィルムが病原性に関与し、外膜透過性低下・排出ポンプ・AmpCなどで多剤耐性化する","アシネトバクター（A. baumannii）はオキシダーゼ陰性・非運動性で、乾燥表面で生残し、人工呼吸器関連肺炎などの医療関連感染を起こす。カルバペネム耐性（CRAB）が問題。ステノトロホモナスはL1/L2βラクタマーゼで多くのβラクタムに自然耐性","百日咳菌は飛沫感染し、カタル期→痙咳期→回復期。百日咳毒素はGi/oαサブユニットをADPリボシル化。鼻咽頭検体を用い、培養は咳開始後約2週間、PCRは約3〜4週間が適する。治療はマクロライド系。レジオネラは水系エアロゾルの吸入で感染し、ヒト-ヒト伝播はない。BCYE-α培地が必要で、尿中抗原は主に血清群1を検出。マクロライド系・ニューキノロン系が中心","ブルセラ（非殺菌乳製品・波状熱）、バルトネラ（B. henselae＝ネコひっかき病）、フランシセラ（野兎病）、コクシエラ（Q熱）は人獣共通感染症で、曝露歴の問診が鍵。ブルセラ・フランシセラは検査室曝露に注意"],

stgK({n:"グラム陽性球菌",ic:"🍇",boss:"ブイアールイー",bi:"🧫",sub:"ブドウ球菌・レンサ球菌・肺炎球菌・腸球菌",
 pts:["ブドウ球菌は集簇状でカタラーゼ陽性、レンサ球菌・腸球菌はカタラーゼ陰性。溶血性はα（緑色調）・β（透明環）・γ（なし）。S. aureusはコアグラーゼ陽性で、接着因子・α毒素・ロイコシジン・スーパー抗原（TSST-1・エンテロトキシン）・バイオフィルムをもつ。毒素性疾患は食中毒・TSS・SSSS（デスモグレイン1の切断）","S. aureusの血液培養陽性は原則重要で、追跡培養・心エコー・転移性感染巣の評価を行う。CoNS（S. epidermidis）は人工物感染・バイオフィルム、S. saprophyticusは若年女性の尿路感染症。MRSAはmecA/mecC由来のPBP2aでβラクタムに低親和性","GASはβ溶血でMタンパク質・ストレプトリジンO/S・発熱毒素（SpeA・SpeC＝スーパー抗原）をもち、咽頭炎・猩紅熱・膿痂疹・壊死性筋膜炎・STSS。続発症に急性リウマチ熱と溶連菌感染後急性糸球体腎炎。GBSは妊婦の保菌と垂直感染で新生児敗血症・髄膜炎。SDSEはC群・G群抗原で蜂窩織炎・菌血症","肺炎球菌はα溶血・ランセット状双球菌で莢膜が中心的な病原因子（肺炎・髄膜炎・IPD）。オプトヒン感受性・胆汁溶解性で鑑別。VGSは亜急性感染性心内膜炎。腸球菌は多くのセファロスポリンに自然耐性で、VREはD-Ala-D-Lacへの標的修飾（VanA＝VCM・TEIC耐性、VanB＝VCM耐性・TEIC感受性）"],

stgK({n:"芽胞・毒素・放線菌",ic:"☠️",boss:"ボツリヌスキン",bi:"☠️",sub:"有芽胞菌・リステリア・ジフテリア・放線菌・抗酸菌",
 pts:["芽胞は環境ストレスに強い休眠構造で、発芽して増殖し病態に関与する（芽胞形成と外毒素産生は別の性質）。炭疽菌はポリ-D-グルタミン酸莢膜とPA・LF・EF、皮膚炭疽は無痛性丘疹から黒色痂皮。セレウス菌は嘔吐型（セレウリド）と下痢型（エンテロトキシン）の食中毒","破傷風毒素は抑制性介在ニューロンでシナプトブレビンを切断し、GABA・グリシンの放出を阻害して痙性麻痺（開口障害・後弓反張）。ボツリヌス毒素はSNAREを切断してAChの放出を阻害し、弛緩性麻痺（複視・眼瞼下垂・嚥下障害）。ウェルシュ菌はα毒素（ホスホリパーゼC）でガス壊疽、C. difficileは抗菌薬による菌叢攪乱と毒素A/Bによる腸炎","リステリアは通性細胞内寄生菌で、低温でも増殖し、Listeriolysin Oで食胞から脱出しActAでアクチン重合して細胞間伝播。妊婦・新生児・高齢者・免疫不全者の髄膜炎・敗血症で、セフェム系に自然耐性。ジフテリア毒素はEF-2をADPリボシル化し、偽膜性咽頭炎・心筋炎・神経障害を起こす","Actinomycesは嫌気性・非抗酸性で内因性、硫黄顆粒を伴う慢性化膿性病変。Nocardiaは好気性・弱抗酸性で環境由来、細胞性免疫低下で肺病変や脳膿瘍。Mycobacteriumはミコール酸に富む抗酸菌で、結核は空気感染。IGRAは感染の補助判定で活動性の確定には使えない。NTM肺症は症状・画像・反復培養で診断"],

 pts:["滅菌は細菌芽胞を含むすべての微生物を死滅・除去する処理、消毒は病原微生物を感染を起こさない程度まで減らす処理で芽胞の完全な死滅は保証しない、洗浄は汚れの物理的除去。洗浄が不十分だと有機物が消毒薬を不活化する。抵抗性は プリオン＞細菌芽胞＞抗酸菌＞非エンベロープウイルス＞真菌＞栄養型細菌・エンベロープウイルス","高圧蒸気滅菌は121℃・15〜20分（プリオンは134℃・18分など）で、殺菌しているのは圧力ではなく飽和水蒸気の湿熱。乾熱は170℃60分・160℃120分・150℃150分でガラス・金属・油脂・粉末に適する。低温殺菌は63℃30分または72℃15秒。常圧蒸気や煮沸の単回処理では芽胞を確実に殺せない。間欠法は加熱と発芽を繰り返す。γ線・電子線は包装後の工業的滅菌、UV-Cは表面・空気の消毒で器具滅菌には不向き","ろ過は殺菌ではなく除去。0.22µmのメンブレンフィルターは熱に弱い血清・抗菌薬溶液などに使うが、ウイルスは通過しうる。空気はHEPAフィルター。熱・湿気に弱い器材はエチレンオキサイドガス（要エアレーション）や過酸化水素ガスプラズマ（セルロース製品・液体は不可）","高水準：グルタラール・フタラール・過酢酸（芽胞は長時間）。中水準：アルコール・次亜塩素酸ナトリウム・ポビドンヨード。低水準：第四級アンモニウム塩・クロルヘキシジン。アルコールは芽胞と一部の非エンベロープウイルスに不十分。次亜塩素酸は有機物で不活化され、酸性洗剤と混ぜない。ノロウイルスは次亜塩素酸ナトリウム（0.1％）と石けん・流水での手洗い"],

stgK({n:"食中毒と感染症法",ic:"🍽️",boss:"ウエルシュキン",bi:"🍛",sub:"食中毒の調べ方・原因菌ごとの特徴・感染症法",
 pts:["食中毒は飲食物などが原因の急性の健康障害で、診断した医師は直ちに最寄りの保健所長へ届け出る（食品衛生法）。感染型（サルモネラ・カンピロバクター・腸炎ビブリオ・病原大腸菌・リステリア）、食品内毒素型（黄色ブドウ球菌・ボツリヌス・セレウス嘔吐型）、生体内毒素型（ウエルシュ菌・セレウス下痢型）に分ける。毒素型は潜伏期が短く嘔吐が目立ち、発熱は少なく、二次感染もない","潜伏期の目安：黄色ブドウ球菌1〜6時間、セレウス嘔吐型0.5〜6時間、ウエルシュ菌6〜18時間、腸炎ビブリオ10〜24時間、サルモネラ6〜72時間、ノロウイルス24〜48時間、カンピロバクター2〜5日。流行曲線は単一曝露で一峰性。原因食品の推定は相対危険度（RR）とオッズ比（OR）で評価し、MLVAやWGSで菌株の関連性を調べる","カンピロバクター：加熱不十分な鶏肉・少量菌でも発症・ギラン・バレー症候群。サルモネラ：卵・鶏肉・野菜・硫化水素産生。EHEC：牛肉・浅漬け・スプラウト・HUS。黄色ブドウ球菌：おにぎり・弁当・耐熱性エンテロトキシン。ウエルシュ菌：カレー・煮物・大量調理後の緩慢な冷却。セレウス菌：嘔吐型は米飯・炒飯、下痢型は肉・スープ。ボツリヌス：瓶詰・真空包装・自家製のいずし","腸炎ビブリオは生魚で、低温流通と基準強化で激減。リステリアは冷蔵温度でも増殖し妊婦・新生児に重症。ノロウイルスは少量で感染し二次感染が多い。アニサキスは酢・塩・しょうゆ・わさびで死滅せず加熱か冷凍が必要。感染症法は1998年制定・1999年施行で、伝染病予防法・性病予防法・エイズ予防法を統合。発生届・発生動向調査・積極的疫学調査が柱で、結核は2007年に統合され二類に位置づけられた"],
 talk:[["s","食中毒って、原因菌がたくさんあって覚えきれないよ"],["k","潜伏期間と原因食品でたどるのじゃ。毒素型は早く、感染型は遅い"],["m","集団発生なら、喫食調査と菌株の解析で原因食品を絞るの！"],["k","届出の根拠法と、感染症法の枠組みも整理せよ"],["boss","…大鍋の底で、ゆっくり冷めるのを待つ"],["s","ウエルシュ菌…！　潜伏期と調理法から攻略しよう"]],

/* ---- 18 嫌気性菌と口腔・胃の細菌 ---- */
stgK({n:"嫌気性菌と口腔・胃の菌",ic:"🦷",boss:"ヘリコバクター・ピロリ",bi:"🌀",sub:"無芽胞嫌気性菌・膿瘍・歯性感染症・H. pylori（参考資料）",
 pts:["無芽胞偏性嫌気性グラム陰性桿菌（Bacteroides fragilis groupやPrevotella、Porphyromonas、Fusobacteriumなど）は、口腔・腸管・産道などの常在菌。皮膚や粘膜の破綻した部位から、本来無菌の場所へ入りこんで感染を起こす（内因性感染）。嫌気性菌と通性嫌気性菌・微好気性菌が混ざった複数菌感染症になりやすく、1検体あたり平均3〜5菌種が分離される。特徴は、膿瘍を作りやすいことと、膿に悪臭があること。検体は綿棒より穿刺吸引で採り、嫌気的に運ぶ","B. fragilisは、ほかの病原菌にはない膿瘍形成能をもち、莢膜多糖体が関与する。β-ラクタマーゼを産生して、共存する菌まで抗菌薬から守ってしまう（間接的病原性）。嫌気性菌は全般にアミノグリコシド系に自然耐性で、この性質は選択分離培地に利用される。抗嫌気性菌薬はカルバペネム、セファマイシン、ピペラシリン／タゾバクタム、クリンダマイシン、ミノサイクリン、一部のフルオロキノロンに限られ、クリンダマイシンにはB. fragilis groupの約3割以上が高度耐性。治療は切開排膿やドレナージが最優先で、抗菌薬を併用する","歯性感染症は、歯科治療の侵襲や歯周炎の増悪で、口腔の嫌気性菌（Prevotellaなど）と口腔レンサ球菌が顎顔面や頸部へ広がって起こる複数菌感染症。頭頸部には解剖学的な隙が多く、炎症が隙に沿って波及して重症化する。糖尿病・腎不全・肝不全などのcompromised hostでは急性に進行し、全身性炎症反応症候群（SIRS）を起こす危険がある。Fusobacterium necrophorumは扁桃周囲の感染から内頸静脈の血栓と敗血症をきたすレミエール症候群の主要な原因菌。口腔カンジダ症では、義歯の接触する粘膜に発赤・腫脹が生じる義歯性口内炎がみられる","Helicobacter pyloriは微好気性のらせん菌で、鞭毛で運動する。強いウレアーゼ活性で尿素を分解してアンモニアを作り、胃酸を中和して胃内に定着する（至適pHは6〜8）。CagA（IV型分泌装置で宿主細胞へ送りこまれる）やVacA（空胞化毒素）が病原因子。慢性胃炎から萎縮・腸上皮化生へ進み、WHOは胃癌の確実な発がん因子（グループ1）と認定した。胃MALTリンパ腫は除菌でリンパ腫が縮小し、十二指腸潰瘍は除菌で再発が激減する。一方、逆流性食道炎では感染率が低く、除菌後にGERDが増えることが報告されている。診断は尿素呼気試験・糞便中抗原・迅速ウレアーゼ試験・組織鏡検・抗体検査。治療はPPI＋アモキシシリン＋クラリスロマイシンの3剤併用で、クラリスロマイシン耐性が2〜3割あり、二次除菌ではメトロニダゾールに替える"],

 pts:["核酸の構成単位はヌクレオチド（五炭糖・塩基・リン酸基）。DNAはデオキシリボース、RNAはリボースで、RNAはチミン（T）の代わりにウラシル（U）を使う。鎖には向きがあり、リン酸側が5'、水酸基側が3'。二本鎖DNAは塩基対（AとT、GとC）による逆並行の相補鎖で、複製は一本鎖にほどいて相補鎖を合成する","ヒトは46本の染色体（約30億塩基対×2）で、遺伝子は全長の約2％、約2万遺伝子。セントラルドグマはDNA→mRNA（転写）→蛋白（翻訳）で、DNA→蛋白やmRNA→DNAは生物はほぼ行わない（ウイルスは生物ではない）。3塩基（コドン）が1アミノ酸に対応し、AUGは開始コドン、UAA・UGA・UAGは終止コドン","遺伝子多型は約1,000塩基に1塩基の頻度。ALDH2多型は日本人のアリル頻度約20％で、両アリルに持つ人は4％、片アリルのみの人は32％。顕性（優性）遺伝は片アリルの変異で症状が出る（機能獲得変異・ハプロ不全・優性阻害）、潜性（劣性）遺伝は両アリルの変異で初めて症状が出る（活性が0％近くになって問題）","次世代シークエンス（NGS）で全エクソーム解析・パネル遺伝子解析が診療に使われ、診断のつかなかった患者の3〜4割に診断がつく。遺伝子治療ではレンチウイルス（HIVを改変）がXSCIDに、CRISPR/CasはBCL11Aを破壊して鎌状赤血球症の治療（2023年承認）に使われる"],

 pts:["ウイルスは遺伝情報（DNAまたはRNA）をもつが自己増殖できない感染性の構造体で、生物ではない（自己増殖できない・代謝しない・外界と隔離されている）。細菌は細胞壁をもち核膜がなく自己複製でき、真菌は細胞壁と核膜をもつ。大きさは約30〜300nmで光学顕微鏡では見えない","基本構造はカプシド（必ずある）・ゲノム（必ずある）・エンベロープ（脂質二重膜、必ずしもない）・テグメント（必ずしもない）。アルコール消毒の有効性はほぼエンベロープの有無で決まる（アルコールは脂質を分解する）。ゲノムの型はDNA・RNA・逆転写の3つに大別でき、Baltimore分類では二本鎖DNA・一本鎖DNA・＋鎖RNA・－鎖RNA・二本鎖RNA・逆転写型の6つ","生活環は吸着→侵入→脱殻→核酸合成・蛋白合成→粒子形成→成熟→放出。吸着は受容体で決まり組織特異性を規定する（EBV＝CD21＝B細胞、HIV＝CCR5・CD4＝CD4陽性T細胞。CCR5欠損者はHIVにほぼ感染しない）。感染細胞は溶解感染（細胞死・最多）・持続/潜伏感染・発がん感染のいずれか（または組み合わせ）","感染経路：飛沫感染（マスク。アデノ・インフルエンザなど）、飛沫核（空気）感染（隔離・N95。麻疹・水痘・結核菌）、接触感染（手指消毒）、経口感染（ノロ・ロタ・A型肝炎）、血液感染（B型・C型肝炎・HIV。針刺し）、動物媒介感染（日本脳炎・狂犬病・デング）、垂直感染（B型肝炎・HTLV-1）、性的接触（HPV・HIV・HTLV-1・単純ヘルペス）"],

 pts:["ワクチンは製造法で4つ。生ワクチン（弱毒化・強力な免疫だが危険性が高い。MR・水痘・ムンプス・ロタ）、不活化ワクチン（現在の主流。A型肝炎・ポリオ不活化・日本脳炎・インフルエンザ）、リコンビナント（B型肝炎・HPV・帯状疱疹のシングリックス）、mRNAワクチン（新型コロナ）。SCID児へのロタ生ワクチンは重症化の危険があり、新生児マススクリーニングで早期発見する","小児期の定期接種：B型肝炎（2016年定期化）・MR・水痘・日本脳炎・HPV（当時は女性のみ）・ロタウイルス。細菌ではDPT-IPV・Hib・肺炎球菌・BCG。海外渡航では黄熱・A型肝炎・B型肝炎・狂犬病・日本脳炎・髄膜炎菌などを検討する","新興感染症＝新たに流行（SARS・MERS・COVID-19）、再興感染症＝いったん収束後に再流行（ジカ熱・デング熱・マラリア・結核）。コロナウイルスはコウモリ→中間宿主（SARSはジャコウネコ、MERSはラクダ）→ヒト。バイオテロの懸念は炭疽菌・天然痘ウイルス・ペスト菌・ボツリヌス菌","感染症法：1類（エボラ・ペスト・ラッサ熱）・2類（ポリオ・結核・ジフテリア・SARS・MERS）・3類（コレラ・チフス）・4類（動物・飲食物から感染し、ヒトからヒトに感染しないもの。A型肝炎・ジカ・日本脳炎・マラリア）・5類（全数：B型・C型肝炎・先天性風疹症候群・風疹・麻疹／定点：インフルエンザ・水痘・ロタ・COVID-19）。1〜4類は全数把握。プリオンはゲノムをもたず、異常型プリオン蛋白が正常型を異常にして神経細胞を障害する（孤発性CJD・致死性家族性不眠症）"],

stgV({n:"ヘルペスウイルス",ic:"🔥",boss:"イービーウイルス",bi:"🧬",sub:"ヘルペス総論・HSV・VZV・CMV・HHV-6/7・EBV",
 pts:["ヘルペスウイルス科はヒトに9種（HSV-1・HSV-2・VZV・CMV・HHV-6A・6B・7・EBV・KSHV）。エンベロープあり・カプシドは正二十面体・二本鎖直鎖DNA（125〜241kbp）で、エンベロープとカプシドの間にテグメントがある。一度感染すると生涯体内に残り、初感染・潜伏感染・再活性化で病気が異なる。α（HSV・VZV＝神経節に潜伏）、β（CMV・HHV-6・7）、γ（EBV・KSHV＝リンパ球）","HSV：初感染は歯肉口内炎、再発は口唇ヘルペス。ほかに角膜炎（樹枝状）、ヘルペス性ひょう疽、カポジ水痘様発疹症（アトピー性皮膚炎）、ベル麻痺の一部、単純ヘルペス脳炎（無治療死亡率約70%）、性器ヘルペス（HSV-2が再発しやすい）、新生児ヘルペス（産道感染・全身型の無治療死亡率85%）。治療はアシクロビル（ウイルスのTKでリン酸化→感染細胞だけに効く）・アメナメビル（ヘリカーゼ・プライマーゼ阻害）・ホスカルネット","VZV：初感染は水痘（全身の発疹・水疱・痂皮）、神経節に潜伏して再活性化すると帯状疱疹（神経支配領域に一致した痛みを伴う集簇性疱疹、50歳以上に多い）。後遺症に帯状疱疹後神経痛。ラムゼイ・ハント症候群は顔面神経麻痺＋耳介の水疱＋難聴・めまい。予防は水痘ワクチン（岡株・生）、帯状疱疹は生ワクチンと組換えワクチン（シングリックス）で2025年4月に定期接種化","CMV：妊婦の初感染で先天性CMV感染症（小頭症・脳内石灰化・感音性難聴）、免疫不全で再活性化（肺炎・網膜炎・腸炎・肝炎）。HHV-6B・7：突発性発疹（熱性けいれん）、ciHHV-6は染色体に組み込まれる。EBV：伝染性単核球症、バーキットリンパ腫、上咽頭癌、胃癌、ホジキンリンパ腫、多発性硬化症のリスク上昇"],

stgV({n:"ポックス・アデノ・B型肝炎",ic:"🧪",boss:"ビーがたかんえん",bi:"🍷",sub:"天然痘・エムポックス・アデノ・パルボ・HPV・ポリオーマ・HBV",
 pts:["ポックスウイルス：エンベロープあり・二本鎖DNA。DNAウイルスの例外で細胞質で増える（自前のRNAポリメラーゼ）。天然痘は種痘ワクチンで1980年に根絶された唯一のヒトの感染症。種痘は生ワクチンなので免疫不全者に使えない。エムポックスは動物からも人からも感染し、2022年・2024年にWHOが国際的な緊急事態を宣言。ワクチンはLC16m8（日本）・JYNNEOS（米国・非増殖性）","アデノウイルス：エンベロープをもたず、アルコール・洗剤に抵抗性。咽頭結膜熱（プール熱）・流行性角結膜炎（はやり目）・出血性膀胱炎（小児・移植後）。ワクチンや遺伝子治療のベクターとしても使われる（AZD1222）","小型DNAウイルス：パルボウイルスB19（一本鎖・伝染性紅斑＝リンゴ病、赤芽球に感染、溶血疾患で貧血が重症化、妊婦では胎児水腫・流産）、ヒトパピローマウイルス（子宮頸がん。9価ワクチンが定期接種、積極的勧奨は2022年4月再開）、ポリオーマウイルス（JC＝進行性多巣性白質脳症、BK＝腎移植後、メルケル細胞ポリオーマ＝メルケル細胞がん）","ヘパドナウイルス（B型肝炎ウイルスHBV）：エンベロープあり・不完全な環状二本鎖DNAで、核内でcccDNAを作り逆転写で増える（受容体NTCP）。乳児期の感染は約90%が慢性化、成人は約5%未満。HBs抗原陽性＝現在感染、HBs抗体＝回復またはワクチン、HBc抗体＝過去または現在の感染（ワクチンでは陰性）。針刺し感染率はHBV最大約60%・HCV1.8%・HIV0.3%。母子感染はHBIG＋ワクチン、2016年に0歳児の定期接種化。治療は核酸アナログ・ペグインターフェロン。免疫抑制・化学療法で再活性化する"],

stgV({n:"神経病原性ウイルス",ic:"🧠",boss:"きょうけんびょう",bi:"🐕",sub:"侵入門戸・広がり・エンテロ・ポリオ・日本脳炎・狂犬病・遅発性感染",
 pts:["ウイルスの侵入門戸は呼吸器・消化管・感覚器（眼・耳・皮膚）・泌尿生殖器・胎盤。体内では局所感染（上気道炎など）か、一次ウイルス血症から血行性・リンパ行性・神経行性に遠隔臓器へ広がる（潜伏期は局所で短め、遠隔臓器で長め）。感染様式は急性感染・持続感染（遅発性感染を含む）・潜伏感染。不顕性感染者も感染源になる","神経病原性ウイルスによる疾患は4分類：①ウイルスの中枢神経感染（無菌性髄膜炎・脳炎）、②感染後の免疫介在性疾患（ギラン・バレー症候群・ADEM・急性脳症）、③遅発性ウイルス感染症（SSPE・PML）、④プリオン病。髄膜炎は発熱・頭痛・嘔吐・項部硬直（髄膜刺激症状）、脳炎は痙攣・意識障害・運動障害・性格変化","エンテロウイルス（ピコルナ科・＋鎖RNA・エンベロープなし・pH3でも安定）は腸と上気道で増え、手足口病・ヘルパンギーナ・無菌性髄膜炎などを起こす。ポリオウイルスは経口（糞口）感染、約95%は不顕性感染、脊髄前角の運動ニューロンを破壊して弛緩性麻痺（呼吸中枢C4で呼吸不全）。日本では1981年以降発症なし、生ワクチン（OPV）から不活化ワクチン（IPV）へ。日本脳炎はフラビウイルス科、コガタアカイエカが媒介しブタ・トリが増幅動物（ワクチンは定期接種・防蚊対策）","狂犬病（ラブドウイルス・弾丸状）はイヌ咬傷で感染し神経行性に中枢へ。恐水症・呼吸麻痺、発症後はほぼ100%死亡、日本は1957年に根絶。曝露後予防（創部洗浄・免疫グロブリン・ワクチンday0,3,7,14,28）。HSV脳炎は疑った時点でアシクロビル。遅発性感染：SSPE（変異麻疹ウイルス・M蛋白変異、乳幼児期の麻疹の7〜10年後）、PML（JCウイルスの再活性化、免疫不全）。プリオン病（CJD）は異常型プリオン蛋白の重合で、急速進行性の認知症・ミオクローヌス・周期性同期性放電（PSD）、髄液14-3-3蛋白、MRI拡散強調画像、医原性は硬膜移植、BSEと変異型CJD、クールー"],

stgV({n:"レトロウイルスとHIV・ATL",ic:"🔁",boss:"エイチティーエルブイ",bi:"🌀",sub:"逆転写・HIV・AIDS・HTLV-1・ATL・内在性レトロウイルス",
 pts:["レトロウイルスはRNAゲノムと逆転写酵素（RT）をもち、感染後にRNA→DNAへ逆転写してプロウイルスとして宿主ゲノムに組み込まれる（インテグラーゼ）。この潜伏感染のため完全駆除が極めて困難。逆転写はtRNAをプライマーにし、LTRが形成される。ヒトゲノムの約9%はHERV（内在性レトロウイルス）で、多発性硬化症などへの関与が疑われる。レトロウイルス研究は何度もノーベル賞に（発がんウイルス・逆転写酵素・癌遺伝子の細胞起源・HIV発見）","HIVはエンベロープをもつ＋鎖RNA（2本）ウイルスで、gp120がCD4と共受容体（X4＝CXCR4・T細胞指向性、R5＝CCR5・マクロファージ指向性）に結合し、gp41が膜融合を起こす。遺伝子はgag・pol・env、調節遺伝子tat・rev、アクセサリー遺伝子nef・vif・vpr・vpu。Tatは転写活性化、Revは未スプライシングmRNAの核外輸送、NefはCD4とMHC-Iを排除、VifはAPOBEC3Gを分解、感染性はプロテアーゼによるGag切断で完成する","AIDSは10〜20年の潜伏期の後、CD4陽性T細胞の減少で日和見感染症・腫瘍（ニューモシスチス肺炎・カポジ肉腫・悪性リンパ腫）を起こす。急性HIV感染症はインフルエンザ様で抗体はまだ陰性（ウインドウ期）。診断はスクリーニング（EIA・PA）→確認検査（ウエスタンブロット）、感染初期はNAT。感染率は母子感染20〜45%、男→女0.2%。日本の新規感染は男性同性間性的接触が多く、「いきなりAIDS」がある。治療は逆転写酵素阻害薬・インテグラーゼ阻害薬・プロテアーゼ阻害薬・侵入阻害薬の併用で、検出限界以下なら感染しない（U=U）。CCR5Δ32変異は感染に抵抗性","HTLV-1は母乳（垂直）・性・血液で感染し、主にCD4陽性CD25陽性T細胞に潜む（cell-to-cell感染、受容体はグルコーストランスポーター）。キャリアは日本に約100万人（西南日本に多い）、成人T細胞白血病（ATL）の生涯発症率は3〜5%、感染から50〜60年後。花弁状核のflower cell、高Ca血症（PTHrP）、血清sIL-2R・LDH上昇。TaxはIL-2/IL-2Rα転写で不死化（免疫原性が強くATL細胞では発現せず）、HBZは全ATL細胞で発現。多段階発がん。治療は化学療法・同種移植・抗CCR4抗体（モガムリズマブ）。ほかにHAM（HTLV-1関連脊髄症）・ぶどう膜炎"],
 talk:[["s","レトロウイルスって、DNAに入り込んじゃうんだよね？"],["v","そうじゃ。RNAをDNAにうつしてヒトのゲノムに組み込む。だから完全な駆除は難しい"],["m","HIVとHTLV-1、どちらも大事よ！　標的の細胞や経過が違うの"],["v","HIVは数年でCD4を壊し、HTLV-1は数十年かけてT細胞をがん化させる"],["boss","…組み込まれた、ひそんで、うごく"],["s","HTLV-1…！　レトロウイルスの共通点から思い出そう"]],

 pts:["検査の性能は対象集団の事前確率（検査前確率）で変わる。感度＝感染者のうち陽性になる割合（高いほど見落とさず、除外診断向き）、特異度＝非感染者のうち陰性になる割合（高いほど偽陽性が少なく、確定診断向き）。陽性的中率は事前確率で大きく変わり、陰性的中率は変化しにくい。ウイルス検査は一般に特異度は高いが感度は十分でなく、陰性でも除外できない","例：感度99%・特異度99%の検査は、有病率20%（100万人中20万人）の集団では陽性的中率約96%、有病率0.01%（100万人中100人）の集団では陽性的中率約1%（陰性的中率はどちらもほぼ100%）。ウイルス分離は方法が各ウイルスでばらばらで煩雑なため行わず（細菌培養との大きな違い）、電子顕微鏡も臨床検査では使わない","抗原検査はウイルス蛋白を抗原抗体反応で検出（キットで約15分。インフルエンザ・新型コロナ・ロタ・ノロ・RS・HBs抗原など）。イムノクロマト法は標識抗体・抗原捕捉抗体・抗体捕捉抗体で構成され、抗体捕捉抗体のラインは必ず出現する（コントロール）。核酸増幅検査（PCR）はウイルスゲノムを検出し特異性が高い。RNAウイルスは逆転写してからPCRを行う（RT-PCR）。リアルタイムの定量PCRもある","病歴・身体所見（突発性発疹など）、病理組織（CMV＝フクロウの目の封入体、HTLV-1＝花細胞flower cell）。抗体検査はIgMが初感染や早期、IgGが既感染を示す。IgMが使えないときは急性期と約2週間後にIgGを測るペア血清で4倍以上の上昇を確認する"],
 talk:[["s","検査が陽性なら、本当に感染してるんだよね？"],["v","それは集団の事前確率で変わるのじゃ。感度・特異度と的中率の関係を押さえよう"],["m","ウイルスの検査は、抗原・核酸増幅・抗体の3つが中心よ！"],["v","病歴や病理、特徴的な所見も大事じゃ"],["boss","…抗体の、ふえ方を、みている"],["s","抗体検査…！　IgMとIgG、ペア血清を思い出して挑もう"]],

stgV({n:"ウイルス発がん",ic:"🎗️",boss:"ヒトパピローマウイルス",bi:"🌸",sub:"がんに関わる7種類のウイルス・肝炎ウイルス・HPV・EBV・HTLV-1",
 pts:["ヒトのがんに関連するウイルスは7種類：HBV（肝細胞がん）、HCV（肝細胞がん）、HPV（子宮頸がん・中咽頭がん）、EBV（バーキットリンパ腫・胃がん・上咽頭癌・節外性NK/T細胞リンパ腫）、HTLV-1（ATL）、KSHV（カポジ肉腫・原発性体腔性リンパ腫）、MCV（メルケル細胞がん）。発がん機構は、ウイルスのがん遺伝子の導入・宿主遺伝子の発現調節・ゲノム不安定性の3系統が複雑に関わる。HBV・HCV・HPV・HTLV-1・KSHVは制圧の見込みがあるが、EBV・MCVは見込みが立っていない","HBVは母子・乳幼児期の感染は慢性化しやすく、慢性肝炎→肝硬変→肝がんと進む（ヒトゲノムへの挿入、TERT周辺）。予防はHBIG＋ワクチン、2016年10月に定期接種化。治療はインターフェロン・核酸アナログ（完治しない）。HCVは慢性化率約7割、血液（薬物乱用・入れ墨）・性交渉で感染し、ワクチンはなく、直接型抗ウイルス薬（DAA：NS3/4A・NS5A・NS5B阻害薬）で95%以上が完治する","HPVは性交渉が唯一の感染経路（稀有な例）で、基底細胞に潜伏感染。E6がp53を抑制しTERTを活性化、E7がpRBを抑制する。16型（子宮頸がんの40〜50%）と18型（20〜30%）が高リスク。ワクチンはL1蛋白のVLPで、感染予防のみ（感染後はほぼ無効）。2価・4価・9価（世界の主流）。日本は2022年4月に積極的勧奨が再開、平成9〜18年度生まれ女性にキャッチアップ接種","EBVは唾液で伝播しB細胞に潜伏。バーキットリンパ腫はt(8;14)のIGH::MYC融合。ワクチンも特異的治療薬もなく制圧の見込みなし。HTLV-1は母乳と性交渉（男→女）で感染し、生きた感染T細胞が必要。現在のガイドラインでは母乳は与えない（2017年8月変更）。ATL・HAM・HTLV-1ぶどう膜炎。KSHV（HHV-8）はAIDSなど極度の免疫不全でカポジ肉腫を起こす（HIV治療の進歩で激減）。MCVは6〜7割に皮膚持続感染し、Large T抗原の変異とゲノム挿入でメルケル細胞がんを起こす"],

 pts:["RNAウイルスは二本鎖RNA（レオ＝ロタ）・＋鎖RNA（ピコルナ＝ポリオ・ライノ、カリシ＝ノロ、トガ、フラビ＝デング・ジカ、コロナ）・－鎖RNA（オルソミクソ＝インフルエンザ、パラミクソ＝麻疹、ラブド＝狂犬病、フィロ＝エボラ、アレナ、ブニヤ）に分かれる。＋鎖RNAはそのままmRNAとして働き、－鎖RNAウイルスは粒子内のRNA依存性RNAポリメラーゼ（RdRp）でmRNAを作る。RNAの複製は誤りが多く、変異しやすい","インフルエンザ（A型）は分節（8本）の－鎖RNA。HA（ヘマグルチニン）がシアル酸受容体に結合して侵入し、M2チャネルが脱殻に働く。核内で複製し、キャップスナッチングでmRNAを作る。NA（ノイラミニダーゼ）は放出に働く。小さな変異は抗原連続変異（drift、季節性流行）、HAやNAの入れ替わりは抗原不連続変異（shift、パンデミック：1918 H1N1スペイン風邪・1957 H2N2・1968 H3N2・2009 H1N1）。薬はNA阻害薬（オセルタミビル・ザナミビル・ラニナミビル・ペラミビル）、バロキサビル（キャップ依存性エンドヌクレアーゼ阻害）、アマンタジン（M2阻害）、ファビピラビル（RNAポリメラーゼ阻害）。ワクチンは不活化","パラミクソウイルス（麻疹・ムンプス・RS・hMPV）は－鎖RNAのエンベロープウイルス。麻疹は空気感染する極めて感染力の強いウイルスで、受容体はSLAM（CD150、免疫細胞）とネクチン4（上皮）で、ワクチン株はCD46も使う。未接種・免疫抑制者がリスクで、抗ウイルス薬はなく、弱毒生ワクチン（MR）で予防。ムンプス（おたふくかぜ）・風疹とともに予防接種が重要","コロナウイルスは＋鎖RNAで、スパイク（S）蛋白で侵入。SARS-CoV-2はACE2（とNRP1）、MERSはDPP4を受容体とし、ヒトコロナウイルス229E・NL63・HKU1・OC43は風邪の原因。複製転写複合体（RTC）で増え、ERGICで出芽。感染は飛沫・接触・エアロゾルで、医療従事者・高齢者・密閉空間がリスク。mRNAワクチンが実用化された"],

 pts:["ピコルナウイルス科（ポリオ・ライノ・エンテロ）は＋鎖RNAでエンベロープをもたず、ゲノム5'端にVPgがつきIRES（内部リボソーム進入部位）で翻訳され、ポリ蛋白が切断されてできる。ポリオウイルス（1〜3型）は糞口感染で、衛生不良・免疫不全・無γグロブリン血症がリスク。ワクチンはSalk（不活化）とSabin（弱毒生）。パキスタン・ナイジェリア・アフガニスタンでは流行（endemic）が残る","フラビウイルス科（デング・ジカ・黄熱・ウエストナイル・日本脳炎）は＋鎖RNAのエンベロープウイルスで、蚊（ネッタイシマカAedes aegyptiなど）が媒介する。疫学はベクターの生息域に左右され、治療薬は特異的なものがない。黄熱は生ワクチンがある（黄熱ワクチン接種証明）","ブニヤウイルス（ハンタウイルス・SFTSウイルス＝バンダウイルス属）は分節した－鎖RNA。ハンタウイルスはげっ歯類（ネズミ）の尿・糞から感染し、中国・ロシアなどで腎症候性出血熱を起こす。アレナウイルス（ラッサ熱など）はアンビセンスRNAゲノムをもつ","フィロウイルス（エボラ・マールブルグ）は－鎖RNAで、出血熱を起こす。アフリカで散発し、感染源はオオコウモリ・サル・ブッシュミート。感染経路は体液接触（死後も含む）・針刺し・葬儀での接触で、家族・医療従事者が高リスク。ヒトに病気を起こすのはZaire（エボラ）・Sudan・Taï Forest・Bundibugyoの4種。ワクチンはrVSV-ZEBOV、治療はモノクローナル抗体（REGN-EB3）。感染症法では1類"],

stgV({n:"先天性感染症",ic:"🤰",boss:"トキソプラズマ",bi:"🐈",sub:"母子感染・TORCH・CMV・風疹・トキソプラズマ・梅毒",
 pts:["母子感染（垂直感染）は胎内（先天）・産道（周産期）・母乳の3つ。胎内感染の代表はCMV・風疹・トキソプラズマ・梅毒・パルボB19・ジカ、産道感染はGBS・HBV・HCV・HSV・HIV・クラミジア、母乳はHIV・HTLV-1・CMV。ポイントは胎盤通過性と臓器親和性。TORCH症候群＝Toxoplasma・Others（梅毒・パルボB19・B型肝炎・ジカ）・Rubella・Cytomegalo・Herpes simplex。妊娠初期にHBV・HCV・風疹・HIV・梅毒、30週までにHTLV-1、36週前後にGBS（陽性なら分娩時に抗菌薬）をスクリーニングする","先天性CMV感染症は母子感染の原因で最多（全出生の0.2〜2%）。症候性は10〜20%で、血小板減少・網膜炎・難聴・精神発達遅滞・脳室周囲石灰化。無症候でも遅発性の難聴が出る（4歳頃まで進行）。診断は生後3週以内の尿PCR（2018年保険収載）、治療はバルガンシクロビル（2023年保険収載）。予防は子どもの唾液・尿に触れたら手洗い、食べ残しを食べない、コンドーム使用","風疹は＋鎖RNAウイルス（マトナウイルス科）で飛沫感染、潜伏期14〜21日、発熱・発疹・頸部リンパ節腫脹。妊娠初期ほど先天性風疹症候群（先天性心疾患・白内障・難聴の3大症状）が起こりやすい（妊娠4週まで約50%、5〜8週約35%）。生ワクチンは妊娠中禁忌、妊娠前に抗体を確認。ジカウイルスは2015年ブラジルで小頭症が急増し、CDCが原因と断定（蚊が媒介、アシクロビルは無効）","トキソプラズマは原虫で、終宿主はネコ。生肉・猫の糞・土から感染し、先天性は網脈絡膜炎・頭蓋内石灰化・水頭症の3大症状（85%は無症候で目の症状は遅発進行）。梅毒（Treponema pallidum）は性的接触で感染し、第1期（初期硬結・硬性下疳）・第2期（バラ疹）・第3期（心血管梅毒・神経梅毒）、妊婦の治療で胎児感染を防げる。先天梅毒はハッチンソン歯・角膜実質炎・内耳性難聴。持続性ペニシリン筋注（2021年承認）で治療"],

/* ---- 12 小児期のウイルス感染症① ワクチン・水痘・ムンプス・麻疹 ---- */
stgV({n:"小児のワクチンと感染症",ic:"🧒",boss:"ましんのちから",bi:"🔴",sub:"ワクチンの総論・水痘・ムンプス・麻疹・排除と根絶",
 pts:["ワクチンは生ワクチン（弱毒化・自然感染とほぼ同じ免疫・感染機会の減少で効果が減衰することも。BCG・水痘・麻疹・風疹）と不活化ワクチン（病原体の成分・免疫が長く続かず複数回接種・安全性が高い。インフルエンザ・Hib）。VPD（ワクチンで予防できる疾患）は約30種類で、20世紀の公衆衛生10大業績の一つ。接種率が高ければ感染症は制御される","水痘はVZVの初感染で、接触・飛沫・空気感染し感染力が強く、健常小児は自然治癒、重症例にはアシクロビル。再活性化で帯状疱疹。2014年に定期接種化されて患者は激減したが、ブレイクスルー水痘が増え、小児科学会は2回接種を推奨。重症例は肺炎・新生児水痘・化学療法中。世界初の水痘ワクチンは高橋理明らが開発（1974年）。水痘パーティー（罹患しに行く行為）は推奨されない","ムンプス（おたふくかぜ）はパラミクソウイルス科の－鎖RNAウイルスで、ヒトが唯一の自然宿主。5〜10歳に好発（約30%は不顕性）、耳下腺腫脹（両側が多い）、合併症は髄膜炎・難聴・睾丸炎（思春期以降）。任意接種で接種率は30〜40%と低く、4〜6年周期で流行する。1989年のMMRワクチン開始後に無菌性髄膜炎が多発し1993年に中止（ワクチンギャップ）。ムンプス難聴は重度が多く片側が約95%","麻疹は空気感染し、免疫がないとほぼ100%感染する。カタル期・コプリック斑・発疹、合併症は肺炎とSSPE（亜急性硬化性全脳炎）。江戸時代は20〜40年ごとに大流行（麻疹は命定め）。弱毒生ワクチンは1966年に日本で接種開始、1978年に定期接種化、2006年から2回接種。日本は2015年3月にWHOから麻疹排除状態と認定。近年は海外からの持ち込みが発端で、20〜40代の若年成人が中心の修飾麻疹（軽症で診断困難、感染拡大の一因）。制圧（control）＜排除（elimination）＜根絶（eradication、天然痘のみ）。ワクチン有効率は発症リスクの低下割合（例：発症率20%が8%になると有効率60%）"],

stgV({n:"小児の呼吸器ウイルス感染症",ic:"🫁",boss:"こうたいせいざい",bi:"🧴",sub:"RSウイルス・インフルエンザ・インフルエンザ脳症・COVID-19・MIS-C",
 pts:["RSウイルスはニューモウイルス科の－鎖RNAウイルスで、細胞同士を融合させて合胞体を作る。F蛋白が膜融合、G蛋白が接着に働き、ワクチンや抗体製剤の標的になる。乳幼児の下気道炎（細気管支炎）の原因で、約90%が2歳以下、日本で毎年約2万人が入院、流行は2017年以降夏〜秋にも見られる。高齢者でも重症化し、COVID-19後の免疫負債で年長児の患者が増えた","RSVの予防：パリビズマブ（1998年）・ニルセビマブ（2022年）の抗体製剤、母体ワクチン（アブリスボ）、高齢者ワクチン（アレックスビー、2026年4月から定期接種化予定）。1965年の不活化ワクチン治験は接種者のほうが重症化し失敗。抗体製剤で入院は約80〜90%減少。2013年にF蛋白の融合前の立体構造が解明されワクチン開発が進んだ","インフルエンザはエンベロープをもちアルコールが有効、ノイラミニダーゼ阻害薬（オセルタミビルなど）で治療。発症後5日程度ウイルスを排泄し、出席停止は発症後5日かつ解熱後2日（幼児は3日）。診断患者の約半数は小児、入院は高齢者に多い。インフルエンザ脳症は小児に特徴的な重篤な中枢神経合併症（けいれんで発症、後遺症約25%・死亡約8%）で、過剰な免疫応答が原因と考えられ髄液からウイルスは通常検出されない。ワクチンは不活化（A型2種＋B型1種、鶏卵で増殖）と小児用の生ワクチン（低温馴化・25℃で増殖）","COVID-19は小児では多くが無症状・軽症だが、感染後2〜6週に川崎病に似たMIS-C（多系統炎症性症候群）が起こりうる。小児が重症化しにくい理由には諸説（鼻腔の自然免疫応答が強い、基礎疾患が少ないなど）。5〜11歳でワクチンは症状のある感染を約43%、入院を約68%、MIS-Cを約95%減らした。ワクチン有効率は暴露時の発症リスクの低下割合で、接種者の発症数が絶対数で多く見えても有効（例：有効率70%でも接種者が多ければ患者数は接種群が多い）。成人のほうが重症化するのは麻疹・水痘、小児が軽症なのはA型肝炎・EBV・デング熱"],

 pts:["医動物は、狭義では寄生虫、広義では寄生虫に疾病媒介動物（蚊・サソリ・毒蜘蛛など）を加えたもの。寄生虫は体内に寄生する内部寄生虫（原虫・蠕虫）と、皮膚に寄生する外部寄生虫（ヒゼンダニ・シラミ・ノミ）に分かれる。原虫は単細胞（マラリア・トキソプラズマ・赤痢アメーバ）、蠕虫は多細胞で吸虫・条虫・線虫に分けられる。微生物学はウイルス・細菌・真菌だが、原虫は便宜上、医動物学で扱う","寄生虫はウイルスや細菌と違い、核膜をもつ真核生物で、細胞壁がなく、複雑な生活史（発育過程）をもつ。原虫は栄養型（trophozoite、活発に運動・分裂）で、環境が悪くなるとシスト（嚢子）をつくる。無性生殖（二分裂・多数分裂＝マラリア・内出芽二分裂＝トキソプラズマ）と有性生殖がある。蠕虫は卵→幼虫→成虫と変態して発育し、消化器・生殖器は発達、運動器・感覚器は退化している","蠕虫の分類：吸虫は組織に吸い付くヒルのような形、条虫はきしめん状（さなだむし）、線虫はひも状。吸虫・条虫・線虫の多くは消化管や組織を移動する。常に免疫系の攻撃にさらされるため、免疫回避の仕組みをもつ","宿主：固有宿主（終宿主）は寄生虫が有性生殖できる宿主。中間宿主は発育に必要な固有宿主以外の宿主で、第1・第2中間宿主がいることもある。媒介動物は寄生虫をヒトに伝播させる動物で、機械的媒介（ハエ・ゴキブリ）と生物学的媒介（蚊・ダニ）がある。宿主の防御は、好酸球・肥満細胞（IgE-FcR）・マクロファージの自然免疫とTh2反応（IgE産生）。寄生虫は、細胞内への侵入（トキソプラズマ）、表面抗原の変異（トリパノソーマ）、赤血球への侵入（マラリア、赤血球にはMHCがない）で免疫を回避する"],

 pts:["寄生虫は、飛沫感染も空気感染もしない。接触感染と経口感染（食物・水・土から虫体や虫卵・嚢子を摂取）が非常に多い。血液感染は原虫（マラリア・トリパノソーマ・トキソプラズマ）、動物媒介は非常に多く（蚊＝マラリア、サシガメ＝トリパノソーマ）、垂直感染は先天性トキソプラズマ症、性的接触は膣トリコモナス・赤痢アメーバ（MSMと関連）","寄生虫に特有の感染経路は、経皮感染（寄生虫が自力で皮膚・粘膜を破って侵入、住血吸虫類）と自家感染（体内でつくられた卵・幼虫が同じ宿主内で成虫まで発育する）。感染・伝播の要因は、温暖化による媒介動物の分布拡大、人の往来の活発化、食生活・性生活の多様化","個人の予防は、手洗い・生食しない・十分な加熱・蚊の回避・流行地域を避ける・予防内服など、寄生虫に特有の対策が多く非常に重要。地域社会では集団治療や総合的有害生物管理（媒介動物の地域対策）。感染症法では、4類（動物由来感染症）はマラリアとエキノコッカス症、5類（全数・定点届出）はアメーバ赤痢・クリプトスポリジウム症・ジアルジア症","日本での寄生虫症の位置づけは、日和見感染症（トキソプラズマなど）、動物由来感染症、新興・再興感染症（マラリア）、顧みられない熱帯病（NTDs）。世界ではマラリアの影響が非常に大きく、日本ではマラリアは輸入感染症、アニサキスは比較的よく見るが予後への影響は小さい。検疫は空港・港湾で行われるが、寄生虫の検疫を効果的に行うことは困難"],

/* ---- 02 医動物学総論③ 病害作用・検査・治療 ---- */
stgP({n:"病害作用・検査・治療",ic:"💊",boss:"こうちゅうやく",bi:"💊",sub:"物理的障害・アレルギー・臓器特異性・好酸球・検査・駆虫薬",
 pts:["寄生虫の病害作用は、(1)物理的障害（最も多い。虫体・虫卵による組織の破壊や閉塞、アニサキスによる胃壁の破壊、日本住血吸虫の虫卵が脳などの血管に詰まる塞栓症）、(2)生理活性物質による障害（多くない。赤痢アメーバの蛋白分解酵素など）、(3)抗原作用による障害（1型アレルギー、IgE産生、好酸球増多。まれにレフレル症候群＝肺に好酸球が浸潤）","臓器特異性：腸管＝回虫・横川吸虫・日本海裂頭条虫・蟯虫・赤痢アメーバ、赤血球（＋肝臓）＝マラリア、肺＝肺吸虫、肝＝肝吸虫・エキノコッカス、脳＝トキソプラズマ、膣＝トリコモナス。2か所以上に特異性を示すものもあり、トキソプラズマは脳・眼・筋肉・肺、回虫は小腸→肝→肺→咽頭→小腸と回る。違う臓器に入り込む（迷入）、流れ着く（転移）こともある。問診では、食事内容（特に生食）・海外渡航歴・居住歴・ペット飼育歴が大事","検査：疑うきっかけになるのは好酸球増多（血算）とIgEの増加。確定診断は特異度の高い検査で、(1)形態検査（虫体・虫卵を検出、集卵法）、(2)遺伝子検査（PCR）、(3)抗原検査（マラリアなど）、(4)抗体検査（アニサキス・肺吸虫・肝吸虫など）","治療：内視鏡的摘出（アニサキス）、外科的切除（感染巣）、治療薬。抗原虫薬はキニーネ・クロロキン・メフロキン・アルテミシニン・メトロニダゾール・SP合剤（スルファドキシン／ピリメタミン）。抗蠕虫薬（駆虫薬）はピランテル・プラジカンテル・イベルメクチン・メベンダゾール・アルベンダゾール・ジエチルカルバマジンで、ピランテルとプラジカンテルが非常に多くの蠕虫に効く"],
 talk:[["s","寄生虫がつくる病気は、細菌やウイルスと何が違うの？"],["v","物理的な障害が最も多いのが特徴じゃ"],["m","アレルギーも多くて、好酸球が増えるのよ！"],["v","検査は好酸球増多がきっかけ。確定は虫体・虫卵の検出などじゃ"],["boss","…すべての、むしに、きく"],["s","駆虫薬…！　病害作用・検査・治療を整理して挑もう"]],

 pts:["吸虫（Trematoda）は扁形動物で、住血吸虫以外は雌雄同体、口吸盤と腹吸盤の2個の吸盤をもつ。生活史の途中で幼生生殖を行い、ミラシジウム→スポロシスト→レジア（娘レジア）→セルカリア→メタセルカリアと発育する。第2中間宿主が必要な種と不要な種があり、感染型はメタセルカリア（経口感染）とセルカリア（住血吸虫の経皮感染）がある。保虫宿主が多い","横川吸虫（異形吸虫類）は腸管に寄生し、第1中間宿主はカワニナ、第2中間宿主はアユ・ウグイ・フナ・シラウオなどの淡水魚。セルカリアが魚の鱗や皮下・筋肉でメタセルカリアになり、人が魚を生食して感染、小腸で約1週間で成虫（1〜1.7mm）に発育する。日本の寄生虫感染の1位がアニサキス、2位が横川吸虫、3位が広節裂頭条虫。虫卵は小形（26〜32×15〜18µm）の褐色で、卵蓋と卵殻の接続部が滑らかで網目模様がなく、内容はミラシジウム","肥大吸虫は成虫が約7cmと大きく、日本にはおらず東南アジアに分布。第1中間宿主はヒラマキガイで、セルカリアが菱の実・レンコンなどの水生植物に付いてメタセルカリアになり、これらの生食で感染する（固有宿主はブタ・ヒト）。浅田棘口吸虫は約9mmで、ドジョウ・カエルなどの生食で感染する。虫卵は両種とも大きく、楕円形で淡黄色、小蓋がある","症状は腹痛・下痢・好酸球増加など。診断は糞便の虫卵検査、治療はプラジカンテル。予防は淡水魚や水生植物を生で食べないこと"],

stgP({n:"肝・胆管と肺の吸虫",ic:"🦀",boss:"はいきゅうちゅう",bi:"🦀",sub:"肝吸虫・肝蛭・肺吸虫・虫卵の見分け",
 pts:["肝吸虫は胆管に寄生する。第1中間宿主はマメタニシ、第2中間宿主はコイ科の淡水魚（モツゴ・モロコ・フナなど）で、その生食で感染する。成虫は1〜2cm、寿命は10年以上。症状は胆汁うっ滞・胆管肥厚・肝腫大・肝障害（胆管癌を併発することがある）。診断は糞便・胆汁の虫卵検出、治療はプラジカンテル・トリクラベンダゾール。日本にはほとんどいない","肝蛭は第1中間宿主がヒメモノアラガイで、メタセルカリアがセリ・クレソン・菱の実・牧草などに付く。小腸で脱嚢した幼虫は腸壁を穿通して腹腔に出て、肝臓に入り胆管に至り、3〜4か月で成虫（2〜3cm）になる。症状は胆石様発作・肝障害・高度の好酸球増加。診断は糞便・胆汁の虫卵検査と抗体検査（虫卵が検出されないことがあるので免疫血清診断が有効）、治療はトリクラベンダゾール・プラジカンテル。日本ではウシの感染率が高い","肺吸虫（ウエステルマン肺吸虫・宮崎肺吸虫）は成虫がコーヒー豆様で、肺に寄生する。第1中間宿主はカワニナ（宮崎肺吸虫はホラアナミジンニナ）、第2中間宿主はモクズガニ・サワガニで、カニの生食やカニを食べたイノシシの刺身で感染する。小腸で脱嚢した幼虫は腸壁を穿通→腹腔→腹壁→横隔膜→胸腔→肺と移行し、虫嚢を形成して成熟する","肺吸虫の症状はチョコレート色の血痰・肺結核様症状・胸水貯留・気胸で、成虫が脳に異所寄生すると脳肺吸虫症（脳神経症状）。診断は喀痰・糞便の虫卵検査、抗体検査、画像診断、治療はプラジカンテル。虫卵は、肝吸虫が小形の褐色で卵蓋の接合部が突出し網目模様がある、肝蛭が非常に大きい淡黄色で小蓋がある、ウエステルマン肺吸虫が黄金色の小判形で卵蓋のある側がやや広い"],

stgP({n:"住血吸虫",ic:"🩸",boss:"にほんじゅうけつきゅうちゅう",bi:"🩸",sub:"経皮感染・日本・マンソン・ビルハルツ・虫卵結節・診断",
 pts:["住血吸虫（Schistosoma）は、他の吸虫と違い、雌雄異体で血管内に寄生し、線虫様の形をしている。中間宿主は1つ（貝）で、感染型はセルカリア、感染経路は経皮感染（淡水に入ると皮膚から侵入）である。一般の吸虫は扁平で雌雄同体、中間宿主が2つ、感染型がメタセルカリア、経口感染","日本住血吸虫は中国の揚子江流域・フィリピン・インドネシアなどに分布し、日本では1996年に終息宣言が出された。中間宿主はミヤイリガイ。セルカリアが貝から遊出して経皮侵入し、肝門脈系に移行して成虫になる。肝門脈系の血管内で産卵し、血栓・血管周囲炎・肉芽形成（虫卵結節）が起こり、虫卵は壊死した粘膜組織とともに糞便中に排出される。虫卵にはすでにミラシジウムが形成されている","病変は虫卵の塞栓と、虫卵から排出される代謝産物による組織反応による。住血吸虫性肝硬変（肝脾住血吸虫症）、脳住血吸虫症、腹壁静脈の怒張、肝エコーでの魚鱗様紋理がみられる。淡水に入った後の皮膚の発疹はセルカリア皮膚炎。診断は虫卵の検出、卵周囲沈降テスト（COPテスト、卵と被検血清の沈降反応）","マンソン住血吸虫はエジプト・サハラ以南のアフリカ・ブラジル・カリブ海諸国に分布し、ヒラマキガイが中間宿主で、腸間膜静脈系に寄生する。ビルハルツ住血吸虫はアフリカ・中近東・マダガスカルに分布し、膀胱壁静脈系に寄生して血尿・排尿痛を起こす。虫卵はマンソンが側方に棘、ビルハルツが一端（終末）に棘をもち、日本住血吸虫は小さな棘はあるが目立たず、表面に顆粒状物が付く。治療はプラジカンテル"],

stgP({n:"条虫の総論と裂頭条虫",ic:"🍣",boss:"にほんかいれっとうじょうちゅう",bi:"🎏",sub:"条虫の特徴・擬葉類・日本海裂頭条虫・マンソン裂頭条虫",
 pts:["条虫（Cestoda）は、頭節に数個〜数千個の片節が連なった扁平で紐状の虫（体長数mm〜10m）。雌雄同体で、各成熟片節に1対の雌雄生殖器をもつ（大複殖門条虫は2対）。消化管はなく、栄養は体表から吸収する。中間宿主は、擬葉類は2つ、円葉類は1つ。ヒトに成虫が寄生する種と、幼虫が寄生する種がある。擬葉類は日本海（広節）裂頭条虫・大複殖門条虫・マンソン裂頭条虫、円葉類は無鉤条虫・有鉤条虫・小形条虫・縮小条虫・瓜実条虫・有線条虫・単包条虫・多包条虫","日本海裂頭条虫は擬葉類で、成虫が腸管に寄生し、5〜10mにもなる。第1中間宿主はケンミジンコ、第2中間宿主はサケ・マスなどの魚類で、感染型はプレロセルコイド。サケ・マスの生食で感染する。広節裂頭条虫は同様に淡水魚の生食で感染する。大複殖門条虫はイワシの生食で感染し、成虫は3〜6m","マンソン裂頭条虫は、成虫がイヌ・ネコ・キツネ・タヌキなどの小腸に寄生する（0.6〜1m）。ヒトはケンミジンコ→（カエル・ヘビなどの）ゲテモノ肉の経口摂取で感染し、幼虫（プレロセルコイド）が組織に寄生する（孤虫症）。講義資料の重要度はCで、「よくわからない肉の摂取」がキーワード","診断は糞便の虫卵検査や排出された片節の観察。治療はプラジカンテルが用いられる。予防は、サケ・マスなどの魚を生で食べないこと、十分に加熱するか冷凍すること"],

stgP({n:"円葉類とエキノコッカス",ic:"🦊",boss:"たほうじょうちゅう",bi:"🦊",sub:"無鉤条虫・有鉤条虫・嚢尾虫・単包条虫・多包条虫",
 pts:["円葉類は中間宿主が1つの条虫。無鉤条虫は牛肉（嚢尾虫）の不完全調理で感染し、成虫が腸管に3〜7m寄生する。有鉤条虫は豚肉（嚢虫）で感染し、成虫が腸管に2〜5m寄生する。いずれも嚢尾虫（嚢虫）が4〜12mmの大きさで、ヒトは終宿主として成虫が腸管に寄生する","有鉤条虫では、ヒトが虫卵を経口摂取すると、幼虫が組織に寄生する有鉤嚢虫症（ブタの代わりにヒトが中間宿主になる）を起こす。講義資料の重要度はBで、「豚肉の不完全調理」「有鉤嚢虫症」がキーワード","エキノコッカス類は円葉類で、成虫が小形（単包条虫2〜11mm、多包条虫1.2〜4.5mm）。固有宿主はイヌ科の動物（単包条虫はイヌ科、多包条虫はイヌ・キタキツネ・オオカミ）。ヒトは虫卵を経口摂取して中間宿主となり、幼虫（包虫）が組織に寄生する。キタキツネとイヌが感染源で、北海道に多いが愛知（知多半島）でも報告がある。講義資料の重要度はA","エキノコッカス症では肝腫瘤が生じ、治療は外科的切除が基本。感染症法では4類（動物由来感染症）で、致死的な感染症になりうる。予防は、野生動物（キツネなど）の糞に汚染された水や山菜・野菜を生で摂取しないこと、手洗い、イヌの管理など"],

stgP({n:"マラリア",ic:"🦟",boss:"ねっタイねつマラリア",bi:"🩸",sub:"4種のマラリア・生活史・休眠体と再発・重症化・診断と治療",
 pts:["マラリア原虫はヒトに主に4種（三日熱 P. vivax・熱帯熱 P. falciparum・四日熱 P. malariae・卵形 P. ovale）が感染し、ハマダラカ（Anopheles）の雌の吸血で媒介される。世界で最も影響の大きい寄生虫症で、日本では輸入感染症として報告される（感染症法4類、動物由来感染症）。人の往来が増えて再興感染症となった","生活史：蚊の吸血でスポロゾイトが入り、まず肝細胞に入って増える（肝内＝赤血球外期）。放出されたメロゾイトが赤血球に入り、輪状体→栄養体→分裂体（シゾント）と発育して赤血球を壊し、新しいメロゾイトを出す（赤血球内期）。この破壊の周期が発熱の周期になる：三日熱と卵形は48時間、四日熱は72時間、熱帯熱は不規則。一部は雌雄の生殖母体（ガメトサイト）になり、蚊に吸われて蚊の体内で有性生殖する（蚊が固有宿主）","三日熱と卵形では、肝内にヒプノゾイト（休眠体）が残り、治療後しばらくして再発（relapse）する。これを根治するにはプリマキンを使う（熱帯熱・四日熱にはヒプノゾイトがない）。赤血球にはMHCが発現していないので、赤血球内に入ることは免疫回避になる","熱帯熱マラリアは重症化しやすく、感染赤血球が血管内皮に接着して微小循環を障害する。脳マラリア（意識障害・けいれん）、重症貧血、急性腎障害、黒水熱（血管内溶血によるヘモグロビン尿）、低血糖、代謝性アシドーシスなどを起こし、治療が遅れると致死的。診断はギムザ染色の血液塗抹（薄層・厚層）が基本で、迅速診断キット（抗原検査）やPCRも使われる。治療はアルテミシニンを含む併用療法（ACT）が中心で、ほかにキニーネ、メフロキン、アトバコン／プロガニル。予防は蚊帳・防虫剤・予防内服"],
 talk:[["s","世界でいちばん大きな被害を出している寄生虫って？"],["v","マラリアじゃ。ハマダラカが媒介して、赤血球の中で増える"],["m","三日熱と卵形は、肝臓に休眠体が残って再発するのよ！"],["v","熱帯熱は重症化する。脳マラリアは命にかかわるのじゃ"],["boss","…あかいたまを、こわして、ふえる"],["s","熱帯熱マラリア…！　生活史から順に挑もう"]],

stgP({n:"トキソプラズマと腸の原虫",ic:"🐱",boss:"せきりアメーバ",bi:"🫗",sub:"トキソプラズマ・赤痢アメーバ・膣トリコモナス・ジアルジア・クリプトスポリジウム",
 pts:["トキソプラズマ（Toxoplasma gondii）は終宿主がネコで、ネコの腸管で有性生殖してオーシストを糞便に出す。ヒトは中間宿主で、感染源はネコの糞便中のオーシストと、生肉などに含まれる組織シスト。体内では急速に増える型（タキゾイト）が免疫でおさえられ、脳や筋肉に組織シスト（ブラディゾイト）として潜伏する。細胞内に入ることで免疫を回避する","トキソプラズマは免疫が正常ならほとんど無症候（軽いリンパ節腫脹・発熱）だが、免疫不全（AIDSなど）では潜伏していたシストから再活性化してトキソプラズマ脳炎を起こす（日和見感染症）。妊娠中の初感染では先天性トキソプラズマ症（網脈絡膜炎・水頭症・頭蓋内石灰化の3大症状）を起こす。予防は生肉を避ける・土いじりや猫の糞に注意すること","赤痢アメーバ（Entamoeba histolytica）はシストの経口摂取（糞口感染、性的接触＝MSMとの関連）で感染し、大腸で栄養型になる。粘血便（イチゴゼリー状）を伴うアメーバ性大腸炎が典型で、蛋白分解酵素で組織を傷害する。腸管外では肝膿瘍（発熱・右上腹部痛）が重要。診断は糞便の栄養型・シスト、抗体検査、PCRで、治療はメトロニダゾール（腸管内のシストにはパロモマイシンなどを追加）。感染症法5類","膣トリコモナス（Trichomonas vaginalis）はシストをつくらない鞭毛虫で、性的接触で感染し、泡沫状でにおいの強い膣分泌物と外性器粘膜炎を起こす。治療はメトロニダゾールで、パートナーも同時に治療する。ランブル鞭毛虫（ジアルジア）は水や食品から感染して脂肪性の下痢を起こし、クリプトスポリジウムは塩素に抵抗性で水道水の汚染が問題になり、免疫不全者では持続する水様下痢を起こす。どちらも感染症法5類"],

 pts:["線虫は多細胞のひも状の蠕虫で、雌雄異体。消化管内や組織内を移動する。ヒトに重要なものは、アニサキス（イカ・海水魚の生食）、ヒト回虫（虫卵の経口摂取）、蟯虫（肛門周囲への産卵と自家感染）、鉤虫（経皮感染と鉄欠乏性貧血）、回旋糸状虫（ブユが媒介）など。多くの線虫にはピランテルやメベンダゾール・アルベンダゾールなどの駆虫薬が効く","アニサキスは、終宿主がクジラやイルカなどの海獣で、オキアミを経てサバ・イカ・サンマ・アジなどの魚介類に幼虫が入る。ヒトは本来の宿主ではないため成虫にならず、幼虫が胃壁や腸壁に穿入して、生食から数時間後に激しい腹痛・嘔吐を起こす（幼虫移行症）。胃アニサキス症は内視鏡で虫体を摘出するのが治療で、腸アニサキス症では腸閉塞のような症状が出る。予防は十分な加熱と適切な冷凍で、酢・わさび・醤油では死なない。日本でもっとも報告が多い寄生虫症","ヒト回虫（Ascaris lumbricoides）は、虫卵を口から取りこんで感染する（不衛生な環境・土・有機栽培の野菜）。小腸で孵化した幼虫は腸壁から門脈を通って肝、肺へ行き（肺移行期にはレフレル症候群のような好酸球性肺炎を起こすことがある）、気管から咽頭へ上がって飲みこまれ、小腸で成虫になる。成虫は20〜30cmと大きく、胆道や虫垂へ迷入することがある。症状は不定で、診断は糞便の虫卵検査","蟯虫（Enterobius vermicularis）は、雌が夜間に肛門周囲へ出て産卵するため、肛門のかゆみが特徴で、掻いた手から再び口に入る自家感染を起こしやすい。診断はセロハンテープ法（肛囲検卵法）で、家族もまとめて治療する。鉤虫は幼虫が皮膚から侵入する経皮感染で、小腸で血を吸い、鉄欠乏性貧血の原因になる。鞭虫は大腸に寄生する"],
 talk:[["s","魚を生で食べて、急にお腹が痛くなるのは？"],["v","アニサキスじゃ。幼虫が胃や腸の壁に穿入する"],["m","回虫は体の中を大きく回って、肺を通るのよ！"],["v","蟯虫は肛門に産卵し、自家感染をくり返す。鉤虫は皮膚から入る"],["boss","…なまのさかなの、なかで、まつ"],["s","アニサキス…！　線虫の総論から挑もう"]],

stgP({n:"幼虫移行症と外部寄生虫",ic:"🕷️",boss:"ヒゼンダニ",bi:"🕷️",sub:"幼虫移行症・顎口虫・広東住血線虫・糸状虫・疥癬",
 pts:["幼虫移行症（larva migrans）は、ヒトが本来の宿主ではない寄生虫の幼虫が体内を動き回ることで起こる。内臓型の代表はイヌ回虫（Toxocara canis）によるトキソカラ症で、イヌやネコの糞便の虫卵を口にして感染し、肝や肺に病変と好酸球増多をきたし、眼に入ると視力障害（眼トキソカラ症）を起こす。皮膚型では、幼虫が皮膚の中を移動して線状の皮疹（creeping eruption、皮膚爬行症）をつくる","顎口虫は、ドジョウや雷魚などの淡水魚の生食で感染し、幼虫が皮下を移動して皮膚爬行症を起こす。広東住血線虫は、ナメクジやアフリカマイマイなどを介して感染し、好酸球性髄膜炎の原因になる。いずれもヒトでは成虫にならない幼虫移行症で、好酸球増多とIgEの上昇が手がかりになる","糸状虫（フィラリア）は、節足動物が媒介する線虫。回旋糸状虫（オンコセルカ）はブユ（ブラックフライ）が媒介し、皮下に腫瘤をつくり、眼の病変から失明に至る河川盲目症（オンコセルカ症）を起こす。治療はイベルメクチン。バンクロフト糸状虫は蚊が媒介し、リンパ管が障害されてリンパ浮腫や象皮病を起こす（かつて日本にもあった）。治療はジエチルカルバマジン（DEC）","外部寄生虫のヒゼンダニ（Sarcoptes scabiei）は、皮膚の角層にトンネル（疥癬トンネル）を掘って産卵し、強いかゆみを起こす（疥癬）。通常の疥癬は数十匹程度で直接の接触によって伝播するが、免疫が落ちた人では非常に多数が増える角化型疥癬（かつてのノルウェー疥癬）となり、感染力が強く集団発生の原因になる。治療はイベルメクチンの内服やフェノトリンなどの外用。トコジラミは吸血して皮疹を起こし、集団生活の場で問題になる"],
 talk:[["s","ヒトの中で大人になれない寄生虫もいるの？"],["v","そうじゃ。幼虫が体内をさまようのが幼虫移行症じゃ"],["m","イヌ回虫のトキソカラ症や、ドジョウの顎口虫があるわ！"],["v","糸状虫は節足動物が媒介する。外部寄生虫の疥癬も押さえるのじゃ"],["boss","…かくそうに、トンネルを、ほる"],["s","ヒゼンダニ…！　幼虫移行症から順に挑もう"]],

 pts:["原虫：マラリア原虫（コアカリ掲載・重要度A）はハマダラカが媒介し、赤血球内に寄生する。トキソプラズマ（A）はネコの糞便から感染し、細胞内寄生で、先天性トキソプラズマ感染症の原因になる。赤痢アメーバ（A）は粘血便・肝膿瘍を起こし、MSMと関連する。膣トリコモナス（B）は外性器粘膜炎・膣炎を起こす。アフリカトリパノソーマ（C）はツェツェバエ、アフリカ睡眠病。シャーガストリパノソーマ（C）はサシガメ、シャーガス病","線虫：アニサキス（A）はイカや海水魚の生食で感染し、幼虫移行症を起こし、内視鏡で摘出する。ヒト回虫（B）は有機農法の野菜などから感染し、不定症状を起こす。小腸→肝→肺→咽頭→小腸と回り、迷入症もある。回旋糸状虫（オンコセルカ、C）はブユが媒介し、河川盲目症の原因でイベルメクチンが有効","外部寄生虫：ヒゼンダニ（C）は経皮感染で疥癬を起こし、疥癬トンネルをつくる。トコジラミ（C）は吸血し、皮疹を起こす。集団生活で問題になる","寄生虫症は、特別な状況で生じる感染症。魚の生食→アニサキス、川魚やサワガニの生食→吸虫・条虫、不衛生（糞便・土・有機野菜）→回虫、キツネ・イヌ→エキノコッカス類、性交渉（MSM含む）→赤痢アメーバ・膣トリコモナス、川（淡水）で泳ぐ→住血吸虫類（経皮感染）、猫の糞・庭いじり→トキソプラズマ"],

  ["用語：医動物・寄生虫・疾病媒介動物",["医学では「動物」に虫などの生物も含める","寄生虫＝体内・体外に寄生する病原体。体内＝内部寄生虫、皮膚に寄生するもの＝外部寄生虫","疾病媒介動物＝病原体や毒素を媒介する動物（マラリアを運ぶ蚊／毒蜘蛛・毒蛾・サソリなど）","狭義の医動物＝寄生虫、広義＝寄生虫＋疾病媒介動物。医動物学で学ぶのは ほぼ狭義"],"p.13"],
  ["分類の木（ここを覚える）",["内部寄生虫 ─ 原虫（単細胞）：マラリア・トキソプラズマ","内部寄生虫 ─ 蠕虫（多細胞）：吸虫（横川吸虫・日本住血吸虫）・条虫（日本海裂頭条虫）・線虫（アニサキス）","外部寄生虫：ヒゼンダニ・シラミ・ノミ","疾病媒介動物：蚊・サソリ・毒蜘蛛など"],"p.14"],

  ["蠕虫",["吸虫：組織に吸い付く。葉っぱ・ヒル（蛭）のようなイメージ","条虫：きしめん状（さなだむし、Tapeworm）。消化管内・組織内を移動","線虫：ひも状。消化管内・組織内を移動","多細胞。有性生殖（雌雄同体のものもある）。卵→幼虫→成虫と変態して発育","消化器・生殖器は進化し、運動器・感覚器は退化した（奇妙な見た目の理由）","常に免疫系の攻撃にさらされる生活史 → 免疫回避のしくみをもつ"],"p.19"],
  ["（参考）生殖方法　※覚えなくてよい",["無性生殖（原虫のみ）：二分裂／多数分裂（マラリア）／内出芽二分裂（トキソプラズマ）","有性生殖：両性生殖（雌雄同体も）／接合／単為生殖／幼生生殖","1種類の寄生虫が2つ以上の方法をもつこともある"],"p.20"],
  ["外部寄生虫",["主に皮膚に寄生する虫（ダニ・シラミ・ノミ）","例：ヒゼンダニ（疥癬の原因）。環境中から皮膚に侵入し、皮膚の中を移動して皮疹（疥癬トンネル）をつくり、皮膚に産卵する"],"p.21"]]},
 {t:"宿主と防御・回避",src:PAR_SRC.sou_t+" p.22〜23",url:PAR_SRC.sou,sec:[
  ["宿主と媒介動物（この言葉を覚える）",["固有宿主（終宿主）：寄生虫が有性生殖を営める宿主。ヒトのことも ほかの動物のこともある","中間宿主：固有宿主以外で、発育に必要な宿主。第1・第2中間宿主…と複数いることも。固有宿主の餌だったり、固有宿主を襲う媒介動物だったりする","媒介動物：何らかの方法で寄生虫をヒトに伝播させる動物","機械的媒介（物理的に運ぶ）：ハエ・ゴキブリ","生物学的媒介（刺して投入する）：蚊・ダニ"],"p.22"],
  ["宿主の防御反応",["安全な行動：流行地に近寄らない・媒介動物の対策・生食しない","皮膚・粘膜のバリア（ただし経皮感染するものもいる）","自然免疫：好酸球・肥満細胞（IgE-FcR）・マクロファージが中心","獲得免疫：Th2反応（Th2サイトカイン、IgEを含む抗体の産生）","→ 好酸球とIgEは Ⅰ型（即時型）アレルギー反応にもかかわる"],"p.23"],
  ["寄生虫の免疫回避機構",["細胞内への侵入：トキソプラズマ","表面抗原の変異（攻撃を受けると抗原を変える）：トリパノソーマ","赤血球への侵入：マラリア（赤血球には MHC が発現していない）","一般に、寄生虫は免疫で排除されにくい（だから今も生き延びている）"],"p.23"]]}],
1:[{t:"寄生虫の感染経路",src:PAR_SRC.sou_t+" p.24〜25",url:PAR_SRC.sou,sec:[
  ["ウイルスの8つの経路とくらべる",["大気経由：飛沫感染・飛沫核（空気）感染 → 寄生虫では ない","接触感染 → 多い","経口感染 → 非常に多い。食物や環境（水・土など）から虫体・虫卵（嚢子）を取りこむ","血液感染 → ある。原虫（マラリア・トリパノソーマ・トキソプラズマなど）","動物媒介感染 → 非常に多い。蚊（マラリア）・サシガメ（トリパノソーマ）","垂直感染（母子感染） → ある。トキソプラズマ → 先天性トキソプラズマ症","性的接触 → ある。膣トリコモナス・赤痢アメーバ（MSMと関連）"],"p.24〜25"]]},
 {t:"特有の経路と予防",src:PAR_SRC.sou_t+" p.25〜26",url:PAR_SRC.sou,sec:[
  ["寄生虫に特有の感染経路",["(A) 経皮感染：寄生虫が自力で皮膚や粘膜を突き破って体内に侵入する（住血吸虫類）","(B) 自家感染：体内でつくられた卵・幼虫が、同じ宿主の中で再び成虫まで発育する"],"p.25"],
  ["感染・伝播の要因",["自然環境：温暖化で媒介動物の分布が変わる（主に拡大）","人間活動：往来の活発化による持ち込み・寄生虫症の増加／食生活・性生活の多様化"],"p.26"],
  ["予防",["個人的予防（寄生虫に特有の対策が多く、非常に重要）：手洗いの励行・生食しない・十分に加熱・蚊を回避・流行地域を回避・予防内服","地域社会での予防：集団治療・総合的有害生物管理（媒介動物などを地域で対策する）"],"p.26"]]},
 {t:"感染症法と位置づけ",src:PAR_SRC.sou_t+" p.8・27",url:PAR_SRC.sou,sec:[
  ["寄生虫症の過去と現在",["衛生状況の改善と集団駆虫の成功で、日本では ほんとうに まれな病気になった（一生でアニサキスくらいしか遭遇しない）","日和見感染症：免疫不全で感染が成立しやすい（トキソプラズマなど）","動物由来感染症：ハマダラカが媒介するマラリアなど、媒介動物を要するもの","新興・再興感染症：新興は少ないが、マラリアは人の往来の増加で再興感染症に","顧みられない熱帯病（NTDs）：熱帯の途上国で流行し、治療法の開発が進んでいない"],"p.8"],
  ["感染症法と検疫（参考）",["4類（動物由来感染症）：マラリア・エキノコッカス症","5類（全数・定点）：アメーバ赤痢・クリプトスポリジウム症・ジアルジア症","検疫：空港・港湾で ヒト（マラリアなど）・食品（輸入生鮮食品監視）・動植物を検疫","実際には、寄生虫の検疫を効果的に行うことは難しい"],"p.27"]]}],
2:[{t:"病害作用と臓器特異性",src:PAR_SRC.sou_t+" p.29〜30",url:PAR_SRC.sou,sec:[
  ["寄生虫の病害作用（ほかの病原体と しくみが全然違う）",["(1) 物理的障害（最も多い）：虫体・虫卵が臓器や組織を壊したり詰まらせたりする","例：アニサキスが胃壁を壊す（痛い）／日本住血吸虫（血中に寄生）の虫卵が脳などの血管に詰まって塞栓症","(2) 生理活性物質による障害（多くない）：分解酵素や代謝産物。例：赤痢アメーバの蛋白分解酵素","(3) 抗原作用による障害：Ⅰ型アレルギー（IgE産生・好酸球増多）は多い","時に レフレル症候群（肺に好酸球が浸潤し、好酸球性肺炎のような症状・所見）＝まれ"],"p.29"],
  ["臓器特異性",["寄生虫ごとに発育・生殖に適した臓器があり、そこに悪さをしやすい","腸管：回虫・横川吸虫・日本海裂頭条虫・蟯虫・赤痢アメーバ…（多数）","赤血球（＋肝臓）：マラリア原虫","肺：肺吸虫／肝：肝吸虫・エキノコッカス","脳：トキソプラズマ／膣：トリコモナス","2か所以上に特異性：トキソプラズマ（脳・眼・筋肉・肺）、回虫（小腸→肝→肺→咽頭→小腸と回る）","違う臓器に入りこむ＝迷入、流れ着く＝転移"],"p.30"]]},
 {t:"臨床症状と検査",src:PAR_SRC.sou_t+" p.31〜32",url:PAR_SRC.sou,sec:[
  ["臨床症状と問診",["臓器特異性に関連して、起こりやすい症状がある","重要な問診：食事内容（特に生食）・海外渡航歴や居住歴・ペット飼育歴"],"p.31"],
  ["疑うきっかけ（ルーチン検査の異常）",["好酸球増多（ほぼ必ずオーダーする血算でわかる）","IgEの増加（よくわからない感染症のときにオーダーする）"],"p.32"],
  ["確定診断（特異度の高い検査）",["形態検査：虫体・虫卵を検出。疑う寄生虫に応じた集卵法がある","遺伝子検査（PCR）：ゲノムDNAを検出。虫体・虫卵・血液・糞便などが使える","抗原検査：寄生虫抗原を検出。マラリアなど一部で利用","抗体検査：アニサキス・肺吸虫・肝吸虫などで利用"],"p.32"]]},
 {t:"治療",src:PAR_SRC.sou_t+" p.33",url:PAR_SRC.sou,sec:[
  ["寄生虫症の治療法",["内視鏡的摘出：アニサキスを つまみ取る","外科的切除：感染巣を切除する","治療薬：抗原虫薬と抗蠕虫薬（駆虫薬）"],"p.33"],
  ["治療薬",["抗原虫薬：キニーネ・クロロキン・メフロキン／アルテミシニン／メトロニダゾール／スルファドキシン・ピリメタミン（SP）合剤","抗蠕虫薬（駆虫薬）：ピランテル・プラジカンテル／イベルメクチン／メベンダゾール・アルベンダゾール／ジエチルカルバマジン","★ ピランテルとプラジカンテルが非常に多くの蠕虫に効く点が非常に重要"],"p.33"]]}]};

3:[{f:0,src:"吸虫 Minimum Requirements",q:"吸虫類の総論として押さえるべき特徴（Minimum Requirements）を4つ挙げてください。",a:["住血吸虫以外は雌雄同体で、2個の吸盤（口吸盤・腹吸盤）をもつ","生活史の過程で幼生生殖する（ミラシジウム→スポロシスト→レジア→セルカリア→メタセルカリア）","感染源と感染型は多様（第2中間宿主が要る／要らない、感染型がメタセルカリア／セルカリア）","保虫宿主を多くもつ"]},
 {f:1,src:"吸虫スライド",q:"横川吸虫の生活史（中間宿主と感染源）と、虫卵の特徴を説明してください。",a:["第1中間宿主：カワニナ → 第2中間宿主：アユ・ウグイ・フナ・シラウオなど（鱗・皮下・筋肉でメタセルカリア）","アユなどの生食で感染し、小腸で約1週間で成虫（1〜1.7mm）になる","日本の寄生虫感染は 1位アニサキス・2位横川吸虫・3位広節裂頭条虫","虫卵は小形・褐色で、肝吸虫卵と違い卵蓋の接続部が滑らかで網目模様がない"]},
 {f:2,src:"吸虫 Minimum Requirements",q:"肥大吸虫と浅田棘口吸虫について、感染・症状・診断・治療を説明してください。",a:["肥大吸虫：体長約7cm。菱の実・レンコンなどの生食で感染（日本にはおらず東南アジア）","浅田棘口吸虫：約9mm。ドジョウ・カエルなどの生食で感染","症状：腹痛・下痢・好酸球増加","診断：糞便の虫卵検査／治療：プラジカンテル"]}],
4:[{f:0,src:"吸虫 Minimum Requirements",q:"肝吸虫について、感染・症状・診断・治療を説明してください。",a:["フナなどコイ科淡水魚の生食で感染（第1中間宿主マメタニシ）","メタセルカリアは小腸で脱嚢し、総胆管から肝内胆管へ侵入。寿命は10年以上","症状：胆汁うっ滞・胆管肥厚・肝腫大・肝障害（胆管癌の併発も）","診断：糞便・胆汁から虫卵を検出／治療：プラジカンテル・トリクラベンダゾール"]},
 {f:1,src:"吸虫 Minimum Requirements",q:"肝蛭について、感染・症状・診断・治療を説明してください。",a:["セリ・クレソン・菱の実などの生食で感染（第1中間宿主ヒメモノアラガイ）","小腸で脱嚢した幼虫が腸壁を穿通→腹腔→肝臓→胆管","症状：胆石様発作・肝障害・高度の好酸球増加","診断：糞便・胆汁の虫卵検査と抗体検査（虫卵が出ないことがあり免疫血清診断が有効）／治療：トリクラベンダゾール・プラジカンテル"]},
